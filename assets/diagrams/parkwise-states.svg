<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
<rect width="1200" height="750" fill="#f5f5f8"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1c1a4d"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e15bff"/></marker>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e2e1ec" stroke-width="1"/></pattern></defs>
<rect width="1200" height="750" fill="url(#grid)" opacity=".7"/>
<polygon points="1080,750 1200,542 1200,750" fill="#8b6cff"/><polygon points="1140,750 1200,646 1200,750" fill="#4a1fe8"/>
<text x="60" y="78" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:20px;font-weight:800;letter-spacing:4px" fill="#4a1fe8">AURORA PARKWISE · CONVEYORS</text>
<text x="60" y="112" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:30px;font-weight:800" fill="#1c1a4d">Conveyor lifecycle, simulated as a state machine</text><rect x="60" y="300" width="240" height="110" rx="6" fill="#fff" stroke="#1c1a4d" stroke-width="3"/><text x="180.0" y="349.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:24px;font-weight:800" fill="#1c1a4d">OFF</text><text x="180.0" y="377.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:17px;font-weight:600" fill="#5f5d78">idle</text><path d="M300 355L336 355" stroke="#1c1a4d" stroke-width="3" fill="none" marker-end="url(#a)" /><rect x="340" y="300" width="240" height="110" rx="6" fill="#fff" stroke="#1c1a4d" stroke-width="3"/><text x="460.0" y="349.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:24px;font-weight:800" fill="#1c1a4d">INITIALIZING</text><text x="460.0" y="377.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:17px;font-weight:600" fill="#5f5d78">start-up</text><path d="M580 355L616 355" stroke="#1c1a4d" stroke-width="3" fill="none" marker-end="url(#a)" /><rect x="620" y="300" width="240" height="110" rx="6" fill="#fff" stroke="#1c1a4d" stroke-width="3"/><text x="740.0" y="349.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:24px;font-weight:800" fill="#1c1a4d">TESTING</text><text x="740.0" y="377.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:17px;font-weight:600" fill="#5f5d78">automated checks</text><path d="M860 355L896 355" stroke="#1c1a4d" stroke-width="3" fill="none" marker-end="url(#a)" /><rect x="900" y="300" width="240" height="110" rx="6" fill="#1c1a4d" stroke="#1c1a4d" stroke-width="3"/><text x="1020.0" y="349.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:24px;font-weight:800" fill="#fff">OPERATIONAL</text><text x="1020.0" y="377.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:17px;font-weight:600" fill="#d9d5ff">in service</text><rect x="470" y="560" width="260" height="96" rx="6" fill="#fff" stroke="#e15bff" stroke-width="3"/><text x="600.0" y="602.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:24px;font-weight:800" fill="#1c1a4d">FAILURE</text><text x="600.0" y="630.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:17px;font-weight:600" fill="#5f5d78">mechanical / electronic</text><path d="M460 410L560 556" stroke="#e15bff" stroke-width="3" fill="none" marker-end="url(#r)" stroke-dasharray="8 6"/><path d="M740 410L660 556" stroke="#e15bff" stroke-width="3" fill="none" marker-end="url(#r)" stroke-dasharray="8 6"/><path d="M470 608 H180 V414" stroke="#e15bff" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#r)"/><text x="190" y="640" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:17px;font-weight:700" fill="#e15bff">reset to OFF</text><text x="60" y="220" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:20px;font-weight:600" fill="#5f5d78">Each unit tracks a weight limit and a grid position (floor, x, y).</text><text x="60" y="250" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:20px;font-weight:600" fill="#5f5d78">Random failures can strike during start-up and testing, so operators see realistic scenarios.</text></svg>