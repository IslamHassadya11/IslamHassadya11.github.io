<text x="60" y="78" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:20px;font-weight:800;letter-spacing:4px" fill="#4a1fe8">AURORA TAXI · OVERVIEW</text>
<text x="60" y="112" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:30px;font-weight:800" fill="#1c1a4d">One system for the whole taxi business</text><rect x="450" y="300" width="300" height="130" rx="6" fill="#1c1a4d" stroke="#1c1a4d" stroke-width="3"/><text x="600.0" y="359.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:30px;font-weight:800" fill="#fff">AURORA Taxi</text><text x="600.0" y="387.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:17px;font-weight:600" fill="#d9d5ff">management system</text><rect x="80" y="200" width="260" height="110" rx="6" fill="#fff" stroke="#1c1a4d" stroke-width="3"/><text x="210.0" y="249.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:28px;font-weight:800" fill="#1c1a4d">Fleet</text><text x="210.0" y="277.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:17px;font-weight:600" fill="#5f5d78">regular · express · intercity</text><rect x="80" y="470" width="260" height="110" rx="6" fill="#fff" stroke="#1c1a4d" stroke-width="3"/><text x="210.0" y="519.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:28px;font-weight:800" fill="#1c1a4d">Stations</text><text x="210.0" y="547.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:17px;font-weight:600" fill="#5f5d78">managers per station</text><rect x="860" y="330" width="260" height="110" rx="6" fill="#fff" stroke="#1c1a4d" stroke-width="3"/><text x="990.0" y="379.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:28px;font-weight:800" fill="#1c1a4d">Subscribers</text><text x="990.0" y="407.0" text-anchor="middle" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:17px;font-weight:600" fill="#5f5d78">orders and ride history</text><path d="M446 345L344 262" stroke="#1c1a4d" stroke-width="3" fill="none" marker-end="url(#a)" /><path d="M446 390L344 520" stroke="#1c1a4d" stroke-width="3" fill="none" marker-end="url(#a)" /><path d="M754 365L856 385" stroke="#1c1a4d" stroke-width="3" fill="none" marker-end="url(#a)" /><polygon points="470,548 482,528 494,548" fill="#4a1fe8"/><text x="508" y="547" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:22px;font-weight:800" fill="#1c1a4d">Encapsulation</text><polygon points="470,600 482,580 494,600" fill="#8b6cff"/><text x="508" y="599" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:22px;font-weight:800" fill="#1c1a4d">Inheritance</text><polygon points="470,652 482,632 494,652" fill="#e15bff"/><text x="508" y="651" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:22px;font-weight:800" fill="#1c1a4d">Polymorphism</text><text x="860" y="520" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:20px;font-weight:600" fill="#5f5d78">Class hierarchies designed</text><text x="860" y="548" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:20px;font-weight:600" fill="#5f5d78">to be extended without</text><text x="860" y="576" text-anchor="start" style="font-family:'Source Sans 3',Segoe UI,system-ui,sans-serif;font-size:20px;font-weight:600" fill="#5f5d78">rewriting existing code.</text></svg>