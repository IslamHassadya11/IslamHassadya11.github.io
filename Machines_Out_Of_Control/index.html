<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machines, Out of Control – מכונות מחוץ לשליטה</title>
<meta name="description" content="An interactive prep unit on autonomy, learning and human control of AI. IT, AI & Sustainability, University of Haifa.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0c2d5e; --navy2:#173f7c; --cyan:#18bfe8; --cyan2:#0aa3d6; --sky:#eaf7fd; --lav:#8e7cf2; --pink:#ef5b93;
  --danger:#e23d5f; --teal:#14a58a; --ink:#1b2b48; --muted:#5b6c89; --line:#dbe8f4;
  --card:#fff; --r:22px; --sh:0 12px 32px rgba(12,45,94,.09), 0 1px 0 rgba(12,45,94,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Source Sans 3","Heebo",system-ui,sans-serif;color:var(--ink);font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased;
  background:#e3f2fc url("img/bg.webp?v=fb264435") center/cover fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(1000px 500px at 85% -10%,rgba(24,191,232,.18),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(142,124,242,.12),transparent 60%)}
img{max-width:100%;display:block}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{color:var(--navy);line-height:1.2;margin:0 0 .4em;font-weight:800}
h1{font-size:clamp(36px,5vw,60px);font-weight:900;letter-spacing:-.02em}
h2{font-size:clamp(24px,3.2vw,32px)}
h3{font-size:21px} h4{font-size:18px}
p{margin:0 0 .9em}
strong{color:var(--navy);font-weight:800}
a{color:var(--cyan2)}
.kicker{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan2);margin-bottom:6px}
.hint{font-size:14px;color:var(--muted);margin:.3em 0}
.hint.err{color:var(--danger);font-weight:600}
.saved{opacity:0;transition:.3s;color:var(--teal);font-weight:700}
.saved.show{opacity:1}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
.row.center{justify-content:center}

/* header */
#top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(12,45,94,.07)}
.top-in{max-width:1040px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:900;font-size:18px}
.brand img{height:34px;width:auto}
.top-r{display:flex;align-items:center;gap:10px}
.me{display:flex;align-items:center;gap:6px;background:var(--sky);border:0;border-radius:999px;padding:3px 12px 3px 4px;font-weight:700;color:var(--navy);font-size:15px}
[dir=rtl] .me{padding:3px 4px 3px 12px}
.me em{font-style:normal;letter-spacing:2px}
.lang{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;text-decoration:none}

main{max-width:1200px;margin:auto;padding:26px 22px 70px}
main.view-welcome{max-width:none;padding:0}
.top-in{max-width:1200px}
.nav-links{display:flex;gap:4px;margin-inline-start:auto;margin-inline-end:14px}
.nav-links button{background:none;border:0;color:var(--navy);font-weight:700;font-size:15px;padding:8px 12px;border-radius:999px}
.nav-links button:hover{background:var(--sky)}
/* website-style welcome */
.w-hero{position:relative;min-height:calc(100vh - 58px);background:#0b1a3d url("img/hero.webp?v=98c4e8f5") 22% 40%/cover no-repeat;display:flex;align-items:center}
.w-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,18,44,0) 25%,rgba(8,18,44,.55) 55%,rgba(8,18,44,.85))}
.w-hero-in{position:relative;width:100%;max-width:1200px;margin:auto;padding:60px 22px;display:flex}
.w-hero-txt{margin-left:auto;max-width:560px;color:#fff;text-align:start}
.w-kick{font-size:14px;font-weight:700;color:#8fe6ff;margin-bottom:14px;letter-spacing:.02em}
.w-hero h1{color:#fff;font-size:clamp(44px,6.5vw,86px);line-height:1.02;margin:0 0 18px;text-shadow:0 6px 30px rgba(0,0,0,.45)}
.w-sub{font-size:clamp(18px,1.8vw,22px);line-height:1.55;color:#d9f4ff;margin:0 0 8px}
.btn.glass{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);backdrop-filter:blur(6px)}
.w-band{padding:64px 22px;background:var(--card)}
.w-band.alt{background:linear-gradient(180deg,#eaf7fd,#f6fbff)}
.w-wrap{max-width:1200px;margin:auto}
.w-intro{max-width:860px;text-align:center}
.w-intro .lead{font-size:24px;line-height:1.5;font-weight:700;color:var(--navy)}
.w-intro p{font-size:18px}
.w-band h2{font-size:clamp(28px,3.4vw,40px);text-align:center;margin-bottom:8px}
.w-lede{text-align:center;color:var(--muted);font-size:18px;max-width:720px;margin:0 auto 30px}
.w-guides{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.w-g{background:var(--card);border-radius:24px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;border-top:6px solid var(--gc)}
.w-g-img{height:300px;display:flex;justify-content:center;align-items:flex-end;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--gc) 18%,#fff),#fff 70%);padding-top:14px}
.w-g-img img{height:100%;width:auto;object-fit:contain}
.w-devs{display:flex;height:100%;justify-content:center}
.w-devs img{height:100%;margin:0 -18px}
.w-g-txt{padding:18px 20px 22px;position:relative}
.w-g-n{position:absolute;top:-22px;inset-inline-start:18px;width:40px;height:40px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.w-g h3{font-size:24px;margin:2px 0 6px}
.w-g p{margin:0;color:var(--muted)}
.w-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:28px 0 10px}
.w-step{background:var(--sky);border-radius:22px;padding:26px;text-align:center}
.w-step span{font-size:40px;display:block}
.w-step b{display:block;color:var(--navy);font-size:20px;margin:8px 0 4px}
.w-step p{margin:0;color:var(--ink)}
.w-foot{background:var(--navy);color:#cfe3ff;padding:34px 22px;text-align:center}
.w-foot img{height:40px;margin:0 auto 10px;filter:brightness(0) invert(1)}
.w-foot p{margin:0 0 8px;font-size:15px}
.w-foot .link{color:#8fe6ff}
/* full-page cards */
.create.full{min-height:0}
.card.full{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center}
.vote.full{display:grid;grid-template-columns:1fr 1.2fr;gap:50px;align-items:center;padding:50px}
.vote.full .vote-img img{max-height:62vh;width:100%;object-fit:contain}
.vote.full .bigq{font-size:clamp(28px,3.2vw,42px)}
.vote.full .vbtn{padding:22px;font-size:22px}
.create2{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;margin-top:10px}
.create .pick{grid-template-columns:repeat(2,1fr);margin:0}
.create .pcard img{height:min(52vh,420px)}
.create .pcard b{font-size:20px}
.name-col p{font-size:18px}
.name-col .btn{margin-top:16px;width:100%}
/* data bars */
.bt-t{font-size:17px;margin:0 0 12px}
.dbars{display:grid;gap:10px}
.dbar{display:grid;grid-template-columns:minmax(140px,1.1fr) 3fr 64px;gap:12px;align-items:center}
.dl{font-weight:700;color:var(--navy);font-size:15px}
.dt{height:22px;background:#e4eef7;border-radius:8px;overflow:hidden}
.dt i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lav));border-radius:8px}
.dv{font-weight:900;color:var(--navy);font-size:17px;text-align:end}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:28px}
.card + .card,.finale > * + *{margin-top:20px}

/* buttons */
.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--cyan),var(--cyan2));box-shadow:0 8px 18px rgba(10,163,214,.3);transition:transform .15s, box-shadow .15s, opacity .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px rgba(10,163,214,.35)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.big{padding:16px 34px;font-size:19px}
.btn.small{padding:9px 18px;font-size:15px}
.btn.ghost{background:var(--card);color:var(--navy);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--cyan)}
.link{background:none;border:0;color:var(--cyan2);font-weight:700;padding:4px 0}
.chip{display:inline-block;background:var(--sky);color:var(--navy);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.chip.ok{background:#e2f7f0;color:#0d7a64}

/* terms */
.term{background:linear-gradient(transparent 62%,rgba(24,191,232,.22) 62%);border:0;border-bottom:2px dotted var(--cyan2);color:var(--navy2);font-weight:700;padding:0 1px;line-height:inherit;border-radius:2px}
.term:hover{background:rgba(24,191,232,.22)}
.nm{color:var(--pink)}

/* hero */
.hero{display:grid;grid-template-columns:1fr;padding:0;overflow:hidden}
.hero-img{position:relative;background:#0b1a3d}
.hero-img img{width:100%;aspect-ratio:16/8;object-fit:cover}
.hero-over{position:absolute;top:0;bottom:0;left:40%;right:4%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
.hero-over h1{margin:0;color:#fff;font-size:clamp(34px,5.2vw,62px);text-shadow:0 4px 24px rgba(0,0,0,.45)}
.hero-over .tag{margin:12px 0 0;color:#bfefff;font-size:clamp(16px,1.8vw,21px);font-weight:600;line-height:1.45;max-width:520px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero-txt{padding:28px 34px 30px}
.meta{font-size:13.5px;color:var(--muted);margin:18px 0 0}
.lead{font-size:19px;font-weight:600;color:var(--navy)}
.guides-peek{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 6px}
.guides-peek>div{background:var(--sky);border-radius:18px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center}
.pk .pt{--s:90px}
.pt.q{font-size:38px;font-weight:900;color:var(--cyan2)}
.guides-peek b{color:var(--navy);margin-top:6px}
.guides-peek small{color:var(--muted);font-size:13px}

/* create */
.create-grid{display:grid;grid-template-columns:300px 1fr;gap:30px;margin-top:12px}
.av-stage{background:linear-gradient(180deg,#dff4fd,#f1faff);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;min-height:340px;position:sticky;top:80px;align-self:start}
.av-big svg{filter:drop-shadow(0 10px 14px rgba(12,45,94,.12));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.av-name{font-weight:900;font-size:22px;color:var(--navy);margin-top:6px;min-height:1.4em}
.fld{display:block}
.fld>span{display:block;font-weight:800;color:var(--navy);margin-bottom:4px}
.fld input,.fld textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);background:#fbfdff;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:0;border-color:var(--cyan)}
.olbl{font-weight:800;color:var(--navy);margin:14px 0 6px}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;color:var(--navy)}
.opt.on{border-color:var(--cyan2);background:#e3f6fd;box-shadow:0 0 0 3px rgba(24,191,232,.18)}
.opt.swb{padding:4px}
.sw{display:block;width:30px;height:30px;border-radius:50%;border:3px solid}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:14px 0 22px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid var(--line);background:linear-gradient(180deg,#f2faff,#fff);border-radius:20px;padding:12px 8px 14px;transition:.15s}
.pcard.off{filter:grayscale(1);opacity:.45;border-color:var(--line)!important;box-shadow:none!important}
.pcard.off:hover{filter:grayscale(.3);opacity:.85}
.pcard{transition:filter .25s,opacity .25s,transform .15s,border-color .15s}
.pcard:hover{border-color:var(--cyan);transform:translateY(-2px)}
.pcard.on{border-color:var(--cyan2);background:linear-gradient(180deg,#dff4fd,#fff);box-shadow:0 0 0 4px rgba(24,191,232,.2)}
.pcard img{height:230px;width:auto;object-fit:contain;margin-bottom:6px}
.pcard b{color:var(--navy);font-size:16px;line-height:1.2;text-align:center}
.pcard small{color:var(--muted);font-size:13px;text-align:center}
.name-row{display:flex;gap:16px;align-items:flex-start;max-width:640px}
.name-row .fld{flex:1}
.name-row .btn{margin-top:30px;white-space:nowrap}
.bopt{padding:3px;border-radius:50%;width:66px;height:66px;display:grid;place-items:center;overflow:hidden}
.bopt img{width:100%;height:100%;object-fit:cover;border-radius:50%;background:#eaf6fd}
.avp{position:relative;display:inline-block;flex:none;vertical-align:middle}
.avp-in{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#fff,#cfeaf9 85%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
.avp-in img{width:100%;height:100%;object-fit:cover}
.avp .hat{position:absolute;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}

/* vote */
.vote{display:grid;grid-template-columns:280px 1fr;gap:30px;align-items:center}
.vote-img img{width:100%;max-height:300px;object-fit:contain}
.bigq{font-size:clamp(24px,3vw,31px)}
.vote-opts{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 8px}
.vbtn{flex:1;min-width:120px;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:16px;font-weight:800;font-size:19px;color:var(--navy);transition:.15s}
.vbtn:hover{border-color:var(--cyan)}
.vbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.prev{background:var(--sky);display:inline-block;padding:6px 14px;border-radius:12px}

/* hub */
.hub-head{display:flex;justify-content:space-between;gap:20px;align-items:center}
.hub-me{display:flex;flex-direction:column;align-items:center;background:var(--sky);border-radius:20px;padding:10px 22px;min-width:150px}
.hub-me b{color:var(--navy)}
.hub-me small{color:var(--muted);font-size:13px}
.ccrole{margin:-6px 0 6px;color:var(--cyan2);font-weight:700}
.path{margin-top:22px}
.gcard{display:grid;grid-template-columns:44px 110px 1fr auto;gap:18px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 22px;position:relative;border-inline-start:6px solid var(--gc,var(--cyan))}
.gcard.locked{opacity:.55;filter:saturate(.5)}
.gcard.done{background:linear-gradient(90deg,#fff,#f3fbff)}
.gnum{width:40px;height:40px;border-radius:50%;background:var(--gc,var(--navy));color:#fff;display:grid;place-items:center;font-weight:900}
.gcard.fin{--gc:var(--navy)}
.grole{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gc,var(--cyan2))}
.gtxt h3{margin:2px 0 4px;font-size:23px}
.gtxt p{margin:0 0 6px;color:var(--muted)}
.lock{font-size:14px;color:var(--muted);font-weight:600}
.conn{width:4px;height:22px;margin-inline-start:42px;background:repeating-linear-gradient(var(--cyan) 0 6px,transparent 6px 11px)}
.pt{display:grid;place-items:center;width:var(--s,100px);height:var(--s,100px);border-radius:50%;background:radial-gradient(circle at 50% 60%,#fff,#dff3fd 70%);overflow:hidden;flex:none;box-shadow:inset 0 0 0 3px rgba(255,255,255,.8),0 4px 12px rgba(12,45,94,.1)}
.pt img{width:100%;height:100%;object-fit:cover;object-position:50% 6%}
.pt.av{overflow:visible;background:none;box-shadow:none}
.gcard.fin .pt img,.handoff .pt.ct img{object-fit:contain;object-position:center;width:86%;height:86%}
.gcard .pt{--s:104px}

/* scene */
.scene-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.scene-title{display:flex;align-items:center;gap:8px}
.scene-title .pt{--s:40px}
.scene-title b{color:var(--navy);font-size:18px}
.scene-title span{color:var(--muted);font-size:14px}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:7px;border-radius:9px;background:#cfe2f1}
.dots i.past{background:var(--gc)}
.dots i.now{background:var(--gc);box-shadow:0 0 0 3px rgba(24,191,232,.2)}
.say-row{display:flex;gap:18px;align-items:flex-end;margin-bottom:20px}
.spk{display:flex;flex-direction:column;align-items:center;flex:none;width:118px;text-align:center}
.spk .pt{--s:110px;background:radial-gradient(circle at 50% 60%,#fff,color-mix(in srgb,var(--gc) 22%,#fff) 75%)}
.spk-name{font-weight:900;color:var(--navy);margin-top:6px;line-height:1.2;font-size:15px}
.spk-name small{display:block;font-weight:600;color:var(--muted);font-size:12.5px}
.spk.team{width:150px}
.spk-pics{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px}
.spk-pics .pt{--s:48px}
.spk-pics .pt.av{--s:84px;width:100%;border-radius:20px;height:auto;background:none;box-shadow:none;overflow:visible;display:flex;justify-content:center}
.bubble{position:relative;background:var(--card);border-radius:24px;padding:22px 26px;box-shadow:var(--sh);font-size:19px;line-height:1.6;flex:1;border:2px solid color-mix(in srgb,var(--gc) 35%,#fff)}
.bubble::before{content:"";position:absolute;bottom:26px;inset-inline-start:-12px;width:22px;height:22px;background:var(--card);border-left:2px solid color-mix(in srgb,var(--gc) 35%,#fff);border-bottom:2px solid color-mix(in srgb,var(--gc) 35%,#fff);transform:rotate(45deg)}
[dir=rtl] .bubble::before{transform:rotate(-135deg)}
.blocks{display:flex;flex-direction:column;gap:18px}
.blk{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:24px 26px}
.blk-note,.blk-p{padding:20px 26px}
.note{background:linear-gradient(135deg,#e6f7fe,#f2efff);border-inline-start:5px solid var(--cyan);border-radius:14px;padding:14px 18px}
.blk>.note:only-child{margin:0}
.blk .note{margin-top:14px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px}
.handoff{display:flex;gap:20px;align-items:center;margin-top:18px;background:linear-gradient(135deg,#fff,#eaf7fd)}
.handoff .pt{--s:116px}
.handoff h3{margin-bottom:4px}
.handoff p{margin:0;color:var(--muted)}

/* timeline */
.tl-track{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 8px;position:relative}
.tl-track::before{content:"";position:absolute;left:0;right:0;top:34px;height:3px;background:var(--line);z-index:0}
.tl-dot{position:relative;z-index:1;flex:1;min-width:76px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center}
.tl-dot::before{content:"";width:22px;height:22px;border-radius:50%;background:var(--card);border:3px solid #b9d3e8;margin-top:10px;transition:.2s}
.tl-dot.seen::before{border-color:var(--cyan)}
.tl-dot.on::before{background:var(--cyan);border-color:var(--cyan2);transform:scale(1.25)}
.tl-dot span{font-weight:800;color:var(--navy);margin-top:6px;font-size:15px}
.tl-card{display:flex;gap:18px;background:var(--sky);border-radius:16px;padding:16px 20px;margin-top:8px;min-height:104px;animation:fade .25s}
.tl-y{font-size:30px;font-weight:900;color:var(--cyan2);min-width:96px}
.tl-card b{color:var(--navy);font-size:18px}
.tl-card p{margin:4px 0 0}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.flip{perspective:900px;height:230px;outline:0}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.f-front,.f-back{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;padding:18px;display:flex;flex-direction:column}
.f-front{background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;justify-content:center;align-items:center;text-align:center}
.flip:nth-child(2) .f-front{background:linear-gradient(150deg,#0a7fb0,var(--cyan))}
.flip:nth-child(3) .f-front{background:linear-gradient(150deg,#6a58d8,var(--lav))}
.f-front b{font-size:27px;font-weight:900}
.f-front span{opacity:.9}
.f-front small{margin-top:10px;font-size:22px;opacity:.7}
.f-back{background:var(--card);border:2px solid var(--line);transform:rotateY(180deg);font-size:16px}
.f-back b{color:var(--navy);font-size:19px}
.flip:focus-visible .flip-in{box-shadow:0 0 0 3px var(--cyan);border-radius:18px}

/* facets */
.facets{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:start}
.fac-img img{border-radius:18px}
.fac{border:2px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:.2s}
.fac.open{border-color:var(--cyan)}
.fac-h{display:flex;align-items:center;gap:10px;padding:12px 16px}
.fac-n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.fac-h b{color:var(--navy);font-size:18px}
.fac-s{color:var(--muted);font-size:15px;flex:1}
.pm{font-size:24px;font-weight:700;color:var(--cyan2);transition:.2s}
.fac.open .pm{transform:rotate(45deg)}
.fac-b{display:none;padding:0 16px 14px 56px}
[dir=rtl] .fac-b{padding:0 56px 14px 16px}
.fac.open .fac-b{display:block;animation:fade .25s}
.fac-b p{display:inline;margin:0}
.loop{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-weight:800}
.loop span{background:var(--sky);color:var(--navy);padding:6px 14px;border-radius:999px}
.loop span.dk{background:var(--navy);color:#fff}
.loop i{font-style:normal;color:var(--cyan2);font-size:22px}
[dir=rtl] .loop i{transform:scaleX(-1)}

/* slider */
.sld-row{display:flex;align-items:center;gap:14px;margin-top:10px}
.sld-row span{font-size:14px;color:var(--muted);font-weight:600;min-width:70px}
.sld-row span:last-child{text-align:end}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:10px;border-radius:9px;background:linear-gradient(90deg,var(--cyan),var(--lav));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--card);border:4px solid var(--navy);box-shadow:0 3px 8px rgba(0,0,0,.2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--card);border:4px solid var(--navy);cursor:pointer}
.sld-val{text-align:center;font-size:15px;color:var(--muted)}
.sld-val b{font-size:34px;color:var(--navy);font-weight:900}

/* laws */
.laws{display:grid;gap:12px}
.law{display:flex;gap:16px;align-items:center;border-radius:18px;padding:16px 20px;background:linear-gradient(135deg,#f4f1ff,#eaf7fd);cursor:pointer;border:2px solid transparent;transition:.2s}
.law:hover{border-color:var(--lav)}
.law-n{width:54px;height:54px;flex:none;border-radius:14px;background:var(--lav);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;font-family:Georgia,serif}
.law-t b{color:var(--navy);font-size:19px}
.law-t p{display:none;margin:4px 0 0;font-size:18px}
.law.open .law-t p{display:block;animation:fade .3s}
.law.open .law-hint{display:none}
.law-hint{font-size:13px;color:var(--muted);display:block}

/* two */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two-c{border-radius:18px;padding:18px;background:#fff1f6;border-top:5px solid var(--pink)}
.two-c.c1{background:#f1efff;border-top-color:var(--lav)}
.two-c b{color:var(--navy);font-size:18px;display:block;margin-bottom:4px}
.two-c p{margin:0}

/* labs */
.labs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lab{display:flex;flex-direction:column;align-items:flex-start;text-align:start;background:linear-gradient(160deg,#fff,#f2f9ff);border:2px solid var(--line);border-radius:18px;padding:16px;transition:.2s}
.lab:hover{border-color:var(--pink);transform:translateY(-2px)}
.lab img{height:130px;width:100%;object-fit:contain;margin-bottom:8px}
.lab-k{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pink)}
.lab b{color:var(--navy);font-size:19px;line-height:1.3;margin:4px 0}
.lab small{color:var(--muted)}
.lab-go{margin-top:8px;font-weight:800;color:var(--cyan2);font-size:14px}

/* rank */
.rank ol{list-style:none;padding:0;margin:8px 0 14px;display:grid;gap:8px}
.rank li{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:14px;padding:10px 14px;animation:fade .2s}
.rk{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.rl{flex:1;font-weight:700;color:var(--navy)}
.rl small{color:var(--muted);font-weight:600}
.rb button{border:0;background:var(--card);border-radius:10px;width:36px;height:34px;margin-inline-start:4px;color:var(--navy);box-shadow:0 2px 5px rgba(12,45,94,.1)}
.rb button:disabled{opacity:.3}

/* case */
.blk-case{padding:0;overflow:hidden}
.case-head{display:flex;align-items:center;gap:14px;background:var(--navy);color:#cfe9ff;padding:12px 24px;font-weight:600}
.stamp{background:var(--danger);color:#fff;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:4px 12px;border-radius:6px;font-size:14px;transform:rotate(-2deg)}
.case-body{padding:22px 26px 4px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:30px;align-items:center}
.case-img{width:100%;border-radius:16px;background:var(--sky)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:6px 26px 18px;clear:both}
.stat{background:var(--sky);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:28px;font-weight:900;color:var(--danger);line-height:1.1}
.stat span{font-size:14px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.terms{padding:0 26px 18px;margin:0;font-size:15px;color:var(--muted)}

/* poll */
.popts{display:grid;gap:10px;margin-top:10px}
.popt{text-align:start;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 18px;font-weight:700;color:var(--navy);transition:.15s}
.popt:hover{border-color:var(--cyan)}
.popt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.after{display:none}
.after.show{display:block;animation:fade .3s}

/* tools / world */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tool,.wc{display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(160deg,#fff,#eef8ff);border:2px solid var(--line);border-radius:18px;padding:18px 12px;font-weight:800;color:var(--navy);text-align:center;transition:.2s;position:relative}
.tool:hover,.wc:hover{border-color:var(--cyan);transform:translateY(-2px)}
.tool.seen::after,.wc.seen::after{content:"✓";position:absolute;top:8px;inset-inline-end:12px;color:var(--teal);font-weight:900}
.ti,.fl{font-size:34px;line-height:1}
.world{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* findings */
.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.find{background:var(--sky);border-radius:16px;padding:16px}
.find b{display:block;font-size:34px;font-weight:900;color:var(--cyan2);line-height:1.1;margin-bottom:6px}
.find p{margin:0;font-size:15.5px}

/* sdg */
.sdgs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sdg{border-radius:18px;padding:18px;background:color-mix(in srgb,var(--sc) 9%,#fff);border-top:6px solid var(--sc)}
.sdg-t{display:inline-block;background:var(--sc);color:#fff;font-weight:900;padding:3px 12px;border-radius:8px;margin-bottom:8px}
.sdg b{display:block;color:var(--navy);font-size:17px;margin-bottom:4px}
.sdg p{margin:0;font-size:15.5px}

/* dial */
.dial-head{display:flex;align-items:center;gap:20px;margin-bottom:10px}
.dial-head img{width:200px}
.dial-ends{display:flex;flex-direction:column;gap:6px;font-weight:700;color:var(--navy);font-size:15px}
.drow{display:grid;grid-template-columns:120px 1fr 160px;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.drow img{width:110px;height:70px;object-fit:contain}
.dmain b{color:var(--navy);display:block;margin-bottom:6px}
.dmain input{width:100%}
.dlbl{font-size:14.5px;font-weight:700;color:var(--cyan2);margin-top:6px}
.drow.locked .dlbl{color:var(--navy)}
.dact{text-align:end}

/* reading */
.rh{font-size:23px;margin:0 0 10px}
.blk p{font-size:17px;line-height:1.7}
.blk > p:last-child{margin-bottom:0}
.rimg{float:inline-end;width:230px;max-width:40%;margin:4px 0 10px 22px;border-radius:16px}
[dir=rtl] .rimg{margin:4px 22px 10px 0}
.blk::after{content:"";display:block;clear:both}
.stl{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px;border-top:3px solid var(--line);padding-top:12px}
.stl div{display:flex;flex-direction:column;gap:2px}
.stl b{color:var(--cyan2);font-size:17px;font-weight:900}
.stl span{font-size:13.5px;color:var(--ink);line-height:1.3}
.nest{display:flex;justify-content:center;margin-bottom:16px}
.nest span{display:block;font-weight:800;font-size:15px;margin-bottom:8px}
.n1{background:#e6f6fd;border:2px solid #9fd8f1;border-radius:22px;padding:14px 18px 18px;width:min(560px,100%);color:var(--navy)}
.n2{background:#d5eefb;border:2px solid #6cc4ea;border-radius:18px;padding:12px 16px 16px;margin-inline-start:26px}
.n3{background:var(--navy);border-radius:14px;padding:12px 16px;margin-inline-start:26px;color:#fff}
.n3 span{margin:0}
.slist{display:grid;gap:10px;margin:4px 0 6px}
.sli{display:flex;gap:14px;align-items:flex-start;background:var(--sky);border-radius:16px;padding:14px 18px}
.sli b{color:var(--navy);font-size:17.5px}
.sli p{margin:2px 0 0;font-size:16px;line-height:1.6}
.sln{width:34px;height:34px;flex:none;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}
.sli.rom{background:linear-gradient(135deg,#e9f7f2,#eaf7fd)}
.sli.rom .sln{border-radius:10px;width:44px;height:44px;background:var(--teal);font-family:Georgia,serif;font-size:19px}
.keys{padding:6px 0 0}
.dfact{grid-column:1/-1;background:#fff8e6;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.55;animation:fade .3s}
.dfact b{color:#8a5a00}
.locked-ok{color:var(--teal);font-weight:900;font-size:22px}
.write h4,.poll h4{margin-bottom:8px}
.blk-poll,.blk-slider,.blk-write{border:2px solid #cdeaf8;background:linear-gradient(180deg,#fff,#f4fbff)}
/* quiz */
.trio{display:flex;gap:4px;align-items:center;flex:none}
.trio .pt{--s:80px}
.trio.sm .pt{--s:52px}
.gcard.quizc{--gc:#f2a900;grid-template-columns:44px auto 1fr auto}
.trio.big{justify-content:center;gap:10px;margin-bottom:10px}
.trio.big img{height:min(34vh,300px);width:auto;animation:popin .5s backwards}
.trio.big img:nth-child(2){animation-delay:.12s}.trio.big img:nth-child(3){animation-delay:.24s}
@keyframes popin{from{opacity:0;transform:translateY(30px) scale(.9)}}
.qz-intro{text-align:center;align-items:center}
.qz-top{display:flex;align-items:center;gap:14px;font-weight:800;color:var(--navy)}
.qz-prog{flex:1;height:12px;background:#e4eef7;border-radius:9px;overflow:hidden}
.qz-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lav));transition:width .4s}
.qz-sc{color:var(--teal)}
.qz-main{display:grid;grid-template-columns:280px 1fr;gap:36px;align-items:center;margin-top:24px}
.qz-who{display:flex;flex-direction:column;align-items:center;text-align:center;animation:popin .45s}
.qz-who img{height:min(48vh,400px);width:auto;object-fit:contain}
.qz-who b{color:var(--navy);font-size:20px;margin-top:6px}
.qz-who small{color:var(--muted)}
.qz-who.team .trio .pt{--s:76px}
.qz-bubble{position:relative;background:var(--card);border:3px solid #bfe6f7;border-radius:24px;padding:22px 26px;font-size:clamp(20px,2vw,26px);font-weight:800;color:var(--navy);line-height:1.35;box-shadow:var(--sh)}
.pop{animation:popin .35s .1s backwards}
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.qz-opt{display:flex;gap:12px;align-items:center;text-align:start;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:16px 18px;font-weight:700;font-size:17px;color:var(--navy);transition:.15s}
.qz-opt:not(:disabled):hover{border-color:var(--cyan);transform:translateY(-2px)}
.qz-opt:disabled{cursor:default}
.qz-l{width:34px;height:34px;flex:none;border-radius:10px;background:var(--sky);display:grid;place-items:center;font-weight:900}
.qz-opt.ok{background:#e3f8ee;border-color:#1fae6b;color:#0b5f39}.qz-opt.ok .qz-l{background:#1fae6b;color:#fff}
.qz-opt.bad{background:#fde8ec;border-color:#e23d5f;color:#8e1630}.qz-opt.bad .qz-l{background:#e23d5f;color:#fff}
.qz-fb{margin-top:16px;border-radius:16px;padding:14px 18px;font-size:16.5px;animation:popin .3s}
.qz-fb.ok{background:#e3f8ee;color:#0b5f39}.qz-fb.bad{background:#fde8ec;color:#8e1630}
.qz-score{display:flex;gap:30px;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#fff,#eaf7fd)}
.qz-big{font-size:72px;font-weight:900;color:var(--navy);line-height:1}
.qz-dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.qz-dots i{width:18px;height:18px;border-radius:50%}
.qz-dots i.ok{background:#1fae6b}.qz-dots i.bad{background:#e23d5f}
.qz-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:20px;align-items:start}
.qz-rev{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.qz-rev li{display:flex;gap:12px;border-radius:14px;padding:12px 14px}
.qz-rev li.ok{background:#e3f8ee}.qz-rev li.bad{background:#fde8ec}
.qz-m{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.qz-rev li.ok .qz-m{background:#1fae6b}.qz-rev li.bad .qz-m{background:#e23d5f}
.qz-rev b{color:var(--navy);font-size:15.5px}
.qz-rev p{margin:2px 0 0;font-size:14.5px}
.qz-rev .why{margin-top:4px;color:var(--ink);opacity:.85}
.qz-rev .yr{color:#8e1630}.qz-rev .cr{color:#0b5f39;font-weight:700}
.lb{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.lb li{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:14px;padding:8px 14px}
.lb li.me-row{background:#fff4d6;box-shadow:inset 0 0 0 2px #f2c14e}
.lb-r{width:30px;text-align:center;font-weight:900;color:var(--navy);font-size:18px}
.lb b{flex:1;color:var(--navy)}
.lb-s{font-weight:900;color:var(--navy)}
.handoff .trio .pt{--s:76px}
/* reading pages with pictures */
.blk-read.has-img{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.blk-read.has-img::after{display:none}
.blk-read.has-img .rimg-wrap{order:2;position:sticky;top:80px}
.rimg-wrap .rimg{width:100%;max-width:none;float:none;margin:0;border-radius:20px;background:var(--sky)}
.rtext p:last-child{margin-bottom:0}
.nest .n4{background:linear-gradient(135deg,var(--pink),var(--lav));border-radius:12px;padding:10px 14px;margin-inline-start:26px;margin-top:8px;color:#fff}
.nest small{font-weight:500;opacity:.75;margin-inline-start:6px;font-size:13px}
.n3 span{margin-bottom:6px}
/* page progress + nav */
.pgbar{width:180px;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.pgbar i{display:block;height:100%;background:var(--gc)}
.nav-mid{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.kwlist{display:grid;gap:8px}
.kwi{background:var(--sky);border-radius:12px;padding:10px 14px}
.kwi b{color:var(--navy)}.kwi p{margin:2px 0 0;font-size:15px}
.resp{background:linear-gradient(135deg,#e7f8f0,#eaf7fd);border-inline-start:5px solid var(--teal);border-radius:14px;padding:12px 16px;margin-top:12px;color:var(--ink);font-size:16px}
.resp b{font-weight:700;color:var(--ink)}
.sl-resp:empty{display:none}
/* charts */
.waffles{display:grid;grid-template-columns:1fr 1.6fr;gap:24px;align-items:end}
.waf{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.waf-g{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%;max-width:300px}
.waf-g i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.waf-g i.on{background:linear-gradient(135deg,var(--pink),var(--danger))}
.waf-g.big{grid-template-columns:repeat(5,1fr);max-width:220px;gap:8px}
.waf-g.big i{border-radius:50%}
.waf b{font-size:28px;font-weight:900;color:var(--danger)}
.waf span{color:var(--muted);font-weight:600}
.cols{display:flex;align-items:flex-end;justify-content:center;gap:clamp(14px,4vw,48px);height:240px;padding-top:28px;border-bottom:3px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:min(110px,22%);position:relative}
.col i{display:block;width:100%;background:linear-gradient(180deg,var(--lav),var(--cyan));border-radius:12px 12px 0 0;min-height:6px}
.col.hi i{background:linear-gradient(180deg,var(--pink),var(--danger))}
.col .cv{font-weight:900;color:var(--navy);font-size:20px;margin-bottom:6px}
.col b{position:absolute;bottom:-30px;color:var(--navy);font-size:15px;white-space:nowrap}
.blk-cols{padding-bottom:46px}
.rings{display:flex;gap:30px;justify-content:center;flex-wrap:wrap}
.ring{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:240px;text-align:center}
.ring-c{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--navy);background:radial-gradient(closest-side,var(--card) 74%,transparent 75%),conic-gradient(var(--cyan) calc(var(--p)*1%),var(--line) 0)}
.ring span{color:var(--muted);font-size:14.5px;font-weight:600}
.dates{list-style:none;margin:0;padding:0;position:relative}
.dates::before{content:"";position:absolute;inset-inline-start:69px;top:6px;bottom:6px;width:3px;background:var(--line)}
.dates li{display:grid;grid-template-columns:62px 1fr;gap:22px;padding:7px 0;position:relative}
.dates li::before{content:"";position:absolute;inset-inline-start:64px;top:13px;width:13px;height:13px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 3px var(--card)}
.dates li.warn::before{background:#f2a900}.dates li.bad::before{background:var(--danger)}
.dates b{color:var(--navy);font-size:14.5px;text-align:end}
.dates span{font-size:15.5px}
/* map */
.map-wrap{background:linear-gradient(180deg,#eaf6fd,#f6fbff);border-radius:20px;padding:10px;margin:10px 0}
.wmap{width:100%;height:auto;display:block}
.wmap .sph{fill:none}
.wmap .c{fill:#d6e3ee;stroke:#fff;stroke-width:.5}
.wmap .eu{fill:#3a6fd8;cursor:pointer}.wmap .us{fill:#18bfe8;cursor:pointer}.wmap .cn{fill:#ef5b93;cursor:pointer}.wmap .il{fill:#14a58a;cursor:pointer}

const TERMS = {
 safestop:{en:["Safe stopping","Training an AI so that when people tell it to pause or stop, it stops cleanly, without resisting or trying to work around the order."],he:["עצירה בטוחה","אימון AI כך שכשבני אדם אומרים לו להשהות או לעצור, הוא עוצר באופן מסודר, בלי להתנגד ובלי לנסות לעקוף את ההוראה."]},
 planetary:{en:["Planetary boundaries","Nine limits on how much human activity can change the Earth's systems, such as climate, fresh water and biodiversity, while staying in a safe zone. They form the outer ring of the doughnut. The latest Planetary Health Check (September 2026) finds that seven of the nine have already been crossed. AI adds to the pressure: data centres, which run AI, are expected to more than double their electricity use by 2030."],he:["גבולות פלנטריים","תשעה גבולות לכמה פעילות אנושית יכולה לשנות את מערכות כדור הארץ, כמו האקלים, המים המתוקים והמגוון הביולוגי, ועדיין להישאר באזור בטוח. הם יוצרים את הטבעת החיצונית של הדונאט. לפי דוח Planetary Health Check האחרון (ספטמבר 2026), שבעה מתוך התשעה כבר נחצו. ה-AI מוסיף ללחץ, כי צריכת החשמל של מרכזי הנתונים שמפעילים אותו צפויה יותר מלהכפיל את עצמה עד 2030."]},
 turingtest:{en:["Turing test","Alan Turing's 1950 idea for judging a machine: a person chats in writing with a machine and a human without seeing them. If the person can't reliably tell which is the machine, the machine passes."],he:["מבחן טיורינג","הרעיון של אלן טיורינג מ-1950 לשפוט מכונה. אדם מתכתב בכתב עם מכונה ועם אדם בלי לראות אותם. אם הוא לא מצליח לזהות בעקביות מי המכונה, המכונה עוברת את המבחן."]},
 imagenet:{en:["ImageNet","A huge collection of labelled photos used for a yearly contest in which computer programs had to recognise what is in each picture. Deep learning's big win there in 2012 changed the field."],he:["ImageNet","אוסף עצום של תמונות מתויגות ששימש לתחרות שנתית, שבה תוכנות מחשב היו צריכות לזהות מה יש בכל תמונה. הניצחון הגדול של הלמידה העמוקה שם ב-2012 שינה את התחום."]},
 aisr:{en:["International AI Safety Report","A report by more than 100 AI experts from over 30 countries, chaired by Yoshua Bengio, that sums up what is known about the risks of the most advanced AI. The 2026 edition came out in February 2026."],he:["הדוח הבינלאומי על בטיחות AI","דוח של יותר מ-100 מומחי AI מיותר מ-30 מדינות, בראשות יושוע בנג'יו, שמסכם את מה שידוע על הסיכונים של ה-AI המתקדם ביותר. מהדורת 2026 פורסמה בפברואר 2026."]},
 nhtsa:{en:["US road-safety regulator (NHTSA)","The National Highway Traffic Safety Administration: the US government agency responsible for road and vehicle safety. Companies testing driverless cars must report crashes to it."],he:["רשות הבטיחות בדרכים האמריקאית (NHTSA)","המינהל הלאומי לבטיחות בדרכים, הגוף הממשלתי בארה\"ב שאחראי על בטיחות בדרכים ובכלי רכב. חברות שבודקות מכוניות ללא נהג חייבות לדווח לו על תאונות."]},
 flag:{en:["Flag (in a hacking test)","A secret piece of text hidden inside a computer system. In a hacking test, finding the flag proves that you managed to break in."],he:["דגל (במבחן פריצה)","פיסת טקסט סודית שמוסתרת בתוך מערכת מחשב. במבחן פריצה, מציאת הדגל מוכיחה שהצלחתם לפרוץ."]},
 classifier:{en:["Safety classifier","An automatic filter that checks what an AI writes or does and blocks anything that looks harmful."],he:["מסווג בטיחות","מסנן אוטומטי שבודק מה AI כותב או עושה וחוסם כל דבר שנראה מזיק."]},
 cotmon:{en:["Reasoning monitor","A tool that reads the step-by-step “thinking” a model writes before it acts, and raises an alarm if it sees a dangerous plan."],he:["מנטר חשיבה","כלי שקורא את „החשיבה” שלב-אחר-שלב שמודל כותב לפני שהוא פועל, ומתריע אם הוא מזהה תוכנית מסוכנת."]},
 writeaccess:{en:["Write access","Permission not only to read files and data, but also to change or delete them."],he:["הרשאת כתיבה","הרשאה לא רק לקרוא קבצים ונתונים, אלא גם לשנות או למחוק אותם."]},
 admin:{en:["Administrator access","The highest level of permission on a computer or server: whoever has it can change settings, install software and control other users."],he:["הרשאות מנהל","רמת ההרשאה הגבוהה ביותר במחשב או בשרת. מי שיש לו אותה יכול לשנות הגדרות, להתקין תוכנות ולשלוט במשתמשים אחרים."]},
 rlhf:{en:["Training with human feedback (RLHF)","People rate a model's answers, and the model is trained to give the kind of answers people rated well. It is one of the main ways companies make models safer and more helpful."],he:["אימון עם משוב אנושי (RLHF)","בני אדם מדרגים את התשובות של מודל, והמודל מאומן לתת תשובות מהסוג שקיבל דירוג טוב. זו אחת הדרכים המרכזיות שבהן חברות הופכות מודלים לבטוחים ומועילים יותר."]},
 wargame:{en:["War game","A simulated conflict that militaries and researchers use to test decisions without any real fighting."],he:["משחק מלחמה","עימות מדומה שצבאות וחוקרים משתמשים בו כדי לבחון החלטות בלי לחימה אמיתית."]},
 escalation:{en:["Escalation","When a conflict becomes more severe step by step, for example from threats to cyberattacks to military strikes."],he:["הסלמה","כשעימות נעשה חמור יותר צעד אחר צעד, למשל מאיומים למתקפות סייבר ועד תקיפות צבאיות."]},
 safetyfw:{en:["Safety framework","A company's published plan for how it tests its most advanced AI for dangers, and which safety measures it must take before release."],he:["מסגרת בטיחות","תוכנית שחברה מפרסמת, שמסבירה איך היא בודקת את ה-AI המתקדם ביותר שלה מפני סכנות, ואילו אמצעי בטיחות היא חייבת לנקוט לפני השחרור."]},
 socialscore:{en:["Social scoring","Rating people by their behaviour or personal traits, and then treating them better or worse because of the score."],he:["דירוג חברתי","דירוג של אנשים לפי ההתנהגות או התכונות שלהם, ואז יחס טוב יותר או גרוע יותר אליהם בגלל הציון."]},
 deepfake:{en:["Deepfake","A fake video, photo or audio clip made with AI that looks or sounds like a real person."],he:["זיוף עומק (Deepfake)","סרטון, תמונה או הקלטה מזויפים שנוצרו בעזרת AI ונראים או נשמעים כמו אדם אמיתי."]},
 ai:{en:["Artificial intelligence (AI)","The field that aims to build machines that can do tasks that usually need human intelligence (Neurosnap). Berente and colleagues define it as “the frontier of computational advancements that references human intelligence in addressing ever more complex decision-making problems”."],he:["בינה מלאכותית (AI)","התחום שמטרתו לבנות מכונות שיכולות לבצע משימות שבדרך כלל דורשות אינטליגנציה אנושית (Neurosnap). ברנטה ועמיתיו מגדירים אותו כ„החזית של התקדמות המחשוב שנשענת על האינטליגנציה האנושית כדי להתמודד עם בעיות החלטה מורכבות יותר ויותר”."]},
 ml:{en:["Machine learning (ML)","A way to build AI in which the system learns patterns from examples, instead of a programmer writing every rule."],he:["למידת מכונה (ML)","דרך לבנות AI שבה המערכת לומדת דפוסים מתוך דוגמאות, במקום שמתכנת יכתוב כל כלל."]},
 dl:{en:["Deep learning","A kind of machine learning that uses neural networks with many layers. It powers speech and image recognition and chatbots."],he:["למידה עמוקה","סוג של למידת מכונה שמשתמש ברשתות נוירונים בעלות שכבות רבות. היא עומדת מאחורי זיהוי דיבור ותמונות וצ'טבוטים."]},
 neural:{en:["Neural network","Software loosely inspired by the brain: layers of connected units whose connections get stronger or weaker as the system learns."],he:["רשת נוירונים","תוכנה בהשראה רופפת של המוח, עם שכבות של יחידות מחוברות, שהקשרים ביניהן מתחזקים או נחלשים בזמן הלמידה."]},
 expert:{en:["Expert system","1980s AI: a program built from many if–then rules written by people, for example “IF the loan is large AND the income is low, THEN refer the application to a manager”."],he:["מערכת מומחה","AI של שנות ה-80, תוכנה שבנויה מהרבה כללי „אם–אז” שבני אדם כתבו, למשל „אם ההלוואה גדולה וגם ההכנסה נמוכה, אז להעביר את הבקשה למנהל”."]},
 autonomy:{en:["Autonomy","Acting without a human stepping in, and often without any human knowing. Self-driving cars and AI that approves loans are examples."],he:["אוטונומיה","פעולה בלי שאדם מתערב, ולעיתים קרובות בלי שאדם בכלל יודע. מכוניות אוטונומיות ו-AI שמאשר הלוואות הן דוגמאות."]},
 learning:{en:["Learning","Improving automatically from data and experience. The more an AI learns its own rules, the harder it is to check."],he:["למידה","השתפרות אוטומטית מתוך נתונים וניסיון. ככל ש-AI לומד יותר כללים בעצמו, קשה יותר לבדוק אותו."]},
 inscrut:{en:["Inscrutability (the “black box”)","When an AI's decisions can be understood only by a few people, or by nobody at all."],he:["אטימות („הקופסה השחורה”)","מצב שבו את ההחלטות של AI יכולים להבין רק מעט אנשים, או אף אחד."]},
 aieffect:{en:["The AI effect","Once an AI technology works and becomes ordinary, people stop calling it AI. Expert systems and spam filters are examples."],he:["אפקט ה-AI","ברגע שטכנולוגיית AI עובדת והופכת לרגילה, מפסיקים לקרוא לה AI. מערכות מומחה ומסנני ספאם הן דוגמאות."]},
 laws:{en:["Asimov's Three Laws","Rules for robots from Isaac Asimov's 1942 story “Runaround”: don't harm humans, obey humans, protect yourself, in that order."],he:["שלושת החוקים של אסימוב","כללים לרובוטים מתוך הסיפור „Runaround” של אייזק אסימוב מ-1942, לא לפגוע בבני אדם, לציית לבני אדם, לשמור על עצמך, בסדר הזה."]},
