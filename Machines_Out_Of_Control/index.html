      he:["רובוטים ומערכות AI הם **מכונות לומדות ומסתגלות**. במקום שיתכנתו אותן מראש לכל מצב, הן לומדות מנתונים ומתאימות את עצמן, וכך מכונית אוטונומית מתמודדת עם רחוב שמעולם לא ראתה, ומסנן ספאם תופס סוג חדש של דואר זבל. לפי {{aisr|הדוח הבינלאומי על בטיחות AI}} (פברואר 2026, יותר מ-100 מומחים מיותר מ-30 מדינות), AI לשימוש כללי השתפר מאוד בחשיבה במתמטיקה, בהנדסת תוכנה ובמדע, ומביא תועלת ברפואה, במחקר ובחינוך, אם כי בצורה מאוד לא שוויונית ברחבי העולם.",
          "אבל אותו דוח מזהיר שהיכולות של AI לא אחידות. מערכת יכולה לפתור בעיות קשות ברמת מומחה ועדיין להיכשל במשימות פשוטות, כמו ספירת חפצים בתמונה. והעצמאות שהופכת את המכונות האלה לשימושיות היא בדיוק מה שעלול להוציא אותן משליטתנו. על זה היחידה הזו."]}},
     {t:"keys", items:[["100+",{en:"experts wrote the 2026 safety report",he:"מומחים כתבו את דוח הבטיחות 2026"}],["30+",{en:"countries and organisations took part in the report",he:"מדינות וארגונים השתתפו בדוח"}],[{en:"$100s of billions",he:"מאות מיליארדי דולרים"},{en:"announced for new data centres",he:"הוכרזו למרכזי נתונים חדשים"}]]}
    ], src:["safety"] },

  { say:{en:"Now, where did AI come from? Here's the short history.",he:"עכשיו, מאיפה AI הגיע? הנה ההיסטוריה בקצרה."},
    blocks:[
     {t:"read", img:"p2_hist", two:true, h:{en:"A short history of AI",he:"היסטוריה קצרה של AI"}, p:{
      en:["The idea of thinking machines is older than computers. In 1942, science-fiction writer Isaac Asimov imagined robots that must follow {{laws|three laws}}. In 1950, mathematician Alan Turing asked whether machines can think, and suggested judging a machine by whether its answers could pass for a person's. The term “artificial intelligence” comes from a 1956 summer workshop at Dartmouth College in the United States.",
          "For decades, AI meant rules written by people. In the 1980s, {{expert|expert systems}} packed the knowledge of specialists into thousands of if–then rules. They worked well in narrow areas, but every rule had to be written and updated by hand.",
          "The big change came in the 2010s. Instead of writing the rules, researchers let computers learn them from huge amounts of data. In late 2022, generative AI chatbots, starting with OpenAI's ChatGPT, brought this kind of AI to the general public.",
          "The newest step is {{agent|AI agents}}: systems that don't just answer, but act. They plan a series of steps and use tools such as web browsers and code to finish whole tasks on their own. The International AI Safety Report 2026 warns that because agents act autonomously, it is harder for humans to step in before a failure causes harm."],
      he:["הרעיון של מכונות חושבות ותיק יותר מהמחשב. ב-1942 דמיין סופר המדע הבדיוני אייזק אסימוב רובוטים שחייבים לציית ל{{laws|שלושה חוקים}}. ב-1950 שאל המתמטיקאי אלן טיורינג אם מכונות יכולות לחשוב, והציע לשפוט מכונה לפי השאלה אם התשובות שלה יכולות להיראות כמו של אדם. המונח „בינה מלאכותית” מגיע מסדנת קיץ שהתקיימה ב-1956 במכללת דארטמות' בארצות הברית.",
          "במשך עשרות שנים, AI פירושו היה כללים שבני אדם כתבו. בשנות ה-80 ריכזו {{expert|מערכות מומחה}} את הידע של מומחים באלפי כללי „אם–אז”. הן עבדו היטב בתחומים צרים, אבל כל כלל היה צריך להיכתב ולהתעדכן ידנית.",
          "השינוי הגדול הגיע בשנות ה-2010. במקום לכתוב את הכללים, חוקרים נתנו למחשבים ללמוד אותם מכמויות עצומות של נתונים. בסוף 2022 הביאו צ'טבוטים של בינה מלאכותית יוצרת, החל מ-ChatGPT של OpenAI, את סוג ה-AI הזה לקהל הרחב.",
          "השלב החדש ביותר הוא {{agent|סוכני AI}}, מערכות שלא רק עונות, אלא גם פועלות. הן מתכננות סדרת צעדים ומשתמשות בכלים כמו דפדפן וקוד כדי להשלים משימות שלמות בעצמן. הדוח הבינלאומי על בטיחות AI 2026 מזהיר שמכיוון שסוכנים פועלים באופן אוטונומי, קשה יותר לבני אדם להתערב לפני שתקלה גורמת נזק."]}},
     {t:"tlside"},
    ], src:["britannica","britrobot","turing","dartmouth","berente","krizhevsky","openaichat","safety"] },

  { say:{en:"Three words get mixed up all the time. Here's how they fit inside each other.",he:"שלוש מילים מתבלבלות כל הזמן. הנה איך הן נכנסות אחת בתוך השנייה."},
    blocks:[
     {t:"read", two:true, side:"nest", h:{en:"AI, machine learning and deep learning",he:"AI, למידת מכונה ולמידה עמוקה"}, p:{
      en:["**Artificial intelligence** is the field that aims to build machines that can do tasks that usually need human intelligence, such as understanding language or recognising images. Information systems researchers Berente and colleagues add a twist: for them, AI is a moving frontier, whatever computing is learning to do next. More on their idea soon.",
          "**Machine learning** is a part of AI that develops algorithms that learn from data. Instead of a programmer writing every rule, the system learns patterns from examples. A spam filter, for instance, learns from emails that people have marked as junk. Nobody wrote its exact rules. That makes it powerful, but also harder to check.",
          "**Deep learning** is a part of machine learning that uses {{neural|neural networks}} with many layers, which learn from large amounts of data. It powers speech recognition, image recognition and chatbots."],
      he:["**בינה מלאכותית** היא התחום שמטרתו לבנות מכונות שיכולות לבצע משימות שבדרך כלל דורשות אינטליגנציה אנושית, כמו הבנת שפה או זיהוי תמונות. חוקרי מערכות המידע ברנטה ועמיתיו מוסיפים זווית. מבחינתם AI הוא חזית שזזה כל הזמן, מה שהמחשוב לומד לעשות עכשיו. עוד על הרעיון שלהם בהמשך.",
          "**למידת מכונה** היא חלק מ-AI שמפתח אלגוריתמים שלומדים מנתונים. במקום שמתכנת יכתוב כל כלל, המערכת לומדת דפוסים מתוך דוגמאות. מסנן ספאם, למשל, לומד ממיילים שאנשים סימנו כזבל. אף אחד לא כתב את הכללים המדויקים שלו. זה הופך אותו לחזק, אבל גם לקשה יותר לבדיקה.",
          "**למידה עמוקה** היא חלק מלמידת מכונה שמשתמש ב{{neural|רשתות נוירונים}} בעלות שכבות רבות, שלומדות מכמויות גדולות של נתונים. היא עומדת מאחורי זיהוי דיבור, זיהוי תמונות וצ'טבוטים."]}},
     {t:"read", img:"i_genai", h:{en:"Generative AI and agents",he:"בינה מלאכותית יוצרת וסוכנים"}, p:{
      en:["**{{genai|Generative AI}}** is the newest layer: deep-learning systems that create new text, images or code. The best known are {{llm|large language models}} (LLMs), trained on huge amounts of text to predict what comes next. That one skill lets them write, summarise and answer questions.",
          "ChatGPT, released in late November 2022, reached an estimated 100 million monthly users in about two months: the fastest-growing consumer app in history at the time. Today's {{agent|AI agents}} are built on these models."],
      he:["**{{genai|בינה מלאכותית יוצרת}}** היא השכבה החדשה ביותר, מערכות למידה עמוקה שיוצרות טקסט, תמונות או קוד חדשים. המוכרות ביותר הן {{llm|מודלי שפה גדולים}} (LLM), שמאומנים על כמויות עצומות של טקסט כדי לנחש מה בא אחר כך. היכולת הזו לבדה מאפשרת להם לכתוב, לסכם ולענות על שאלות.",
          "ChatGPT, ששוחרר בסוף נובמבר 2022, הגיע לפי ההערכות ל-100 מיליון משתמשים בחודש תוך כחודשיים, והפך לאפליקציה הצרכנית שצמחה הכי מהר בהיסטוריה עד אז. {{agent|סוכני ה-AI}} של היום בנויים על המודלים האלה."]}},
     {t:"cols", title:{en:"Months to reach 100 million users",he:"חודשים עד 100 מיליון משתמשים"}, hi:0, items:[["ChatGPT",2],["TikTok",9],["Instagram",30]]}
    ], src:["neurosnap","chatgpt"] },

  { say:{en:"Now the theory behind this unit. It comes from our own field, information systems.",he:"עכשיו התיאוריה שמאחורי היחידה. היא מגיעה מהתחום שלנו, מערכות מידע."},
    blocks:[
     {t:"read", img:"c3", h:{en:"Why AI is hard to manage",he:"למה קשה לנהל AI"}, p:{
      en:["In 2021, Nicholas Berente and three colleagues published “Managing Artificial Intelligence” in MIS Quarterly, one of the leading journals in information systems. They describe AI as **the frontier of computing**: whatever computers are newly learning to do. Once something works and becomes ordinary, people stop calling it AI. Expert systems were “AI” in the 1980s; today they are just software. This is called {{aieffect|the AI effect}}.",
          "They argue that today's AI is different from older information technology in three connected ways:"],
      he:["ב-2021 פרסמו ניקולס ברנטה ושלושה עמיתים את המאמר „Managing Artificial Intelligence” בכתב העת MIS Quarterly, מהמובילים בתחום מערכות המידע. הם מתארים את ה-AI כ**חזית המחשוב**, כלומר מה שמחשבים לומדים לעשות עכשיו. ברגע שמשהו עובד והופך לרגיל, מפסיקים לקרוא לו AI. מערכות מומחה היו „AI” בשנות ה-80; היום הן סתם תוכנה. לזה קוראים {{aieffect|אפקט ה-AI}}.",
          "לטענתם, ה-AI של היום שונה מטכנולוגיות מידע ישנות בשלוש דרכים שקשורות זו לזו:"]}},
     {t:"list", num:true, items:[
      {en:["Autonomy","It acts without a human stepping in, and often without anyone knowing. Examples: self-driving cars, apps that move your investments, systems that approve loans."],he:["אוטונומיה","היא פועלת בלי שאדם מתערב, ולעיתים קרובות בלי שמישהו יודע. למשל מכוניות אוטונומיות, אפליקציות שמזיזות השקעות, מערכות שמאשרות הלוואות."]},
      {en:["Learning","It improves by itself from data and experience, instead of following only the rules people wrote."],he:["למידה","היא משתפרת בעצמה מתוך נתונים וניסיון, במקום לפעול רק לפי כללים שבני אדם כתבו."]},
      {en:["Inscrutability","Its decisions can be understood only by a few people, or by nobody at all. This is the “black box” problem."],he:["אטימות","את ההחלטות שלה יכולים להבין רק מעט אנשים, או אף אחד. זו בעיית „הקופסה השחורה”."]}]},
     {t:"note", en:"**The key point:** the three feed each other. The more a system {{learning|learns}} and acts on its own ({{autonomy|autonomy}}), the harder it is to understand ({{inscrut|inscrutability}}). And what we can't understand, we can't fully control. That's why, the authors argue, managing AI is never finished.",
               he:"**הנקודה החשובה:** השלוש מזינות זו את זו. ככל שמערכת {{learning|לומדת}} ופועלת יותר בעצמה ({{autonomy|אוטונומיה}}), כך קשה יותר להבין אותה ({{inscrut|אטימות}}). ומה שאי אפשר להבין, אי אפשר לשלוט בו עד הסוף. לכן, לטענת הכותבים, הניהול של AI אף פעם לא נגמר."},
     {t:"slider", key:"blackbox", min:0, max:10, def:3, q:{en:"Try it on yourself: how well do you understand how ChatGPT chooses its answers?",he:"נסו על עצמכם: עד כמה אתם מבינים איך ChatGPT בוחר את התשובות שלו?"}, ends:{en:["No idea","Fully"],he:["אין לי מושג","לגמרי"]},
      resp:{en:["An honest answer. Even the people who build these models can't fully explain each answer. That's what inscrutability means.","You probably know the general idea: the model predicts the next words from patterns in its training data. But nobody can say exactly why it gave one specific answer. That gap is the black box.","Even experts can't trace exactly why a large model gives a specific answer. Knowing how it works in general is not the same as knowing why it said this."],he:["תשובה כנה. גם מי שבונים את המודלים האלה לא יכולים להסביר עד הסוף כל תשובה. זו בדיוק המשמעות של אטימות.","כנראה שאתם מכירים את הרעיון הכללי, שהמודל מנבא את המילים הבאות לפי דפוסים בנתונים שהוא אומן עליהם. אבל אף אחד לא יכול לומר בדיוק למה הוא נתן תשובה מסוימת. הפער הזה הוא הקופסה השחורה.","גם מומחים לא יכולים לעקוב בדיוק למה מודל גדול נותן תשובה מסוימת. להבין איך הוא עובד באופן כללי זה לא כמו לדעת למה הוא אמר דווקא את זה."]}},
     {t:"slider", key:"trust", min:0, max:10, def:5, q:{en:"Your opinion: how worried are you that AI could get out of human control?",he:"הדעה שלכם: כמה אתם מודאגים ש-AI עלול לצאת משליטה אנושית?"}, ends:{en:["Not at all","Very worried"],he:["בכלל לא","מאוד מודאגים"]},
      resp:{en:["Calm for now, and today's experts partly agree: the International AI Safety Report 2026 says current systems still lack the abilities to escape human control. But the same report says they are improving at acting on their own.","A balanced view. The International AI Safety Report 2026 says today's systems can't yet escape human control, but that AI agents acting on their own make it harder for people to step in before something goes wrong.","You're not alone in worrying. The International AI Safety Report 2026 says today's systems still lack the abilities to escape human control, but it treats loss of control as a serious risk to prepare for, as AI gets better at acting on its own."],he:["רגועים בינתיים, והמומחים מסכימים בחלקם. הדוח הבינלאומי על בטיחות AI 2026 אומר שלמערכות של היום עדיין אין את היכולות לצאת משליטה אנושית. אבל אותו דוח אומר שהן משתפרות בפעולה עצמאית.","גישה מאוזנת. הדוח הבינלאומי על בטיחות AI 2026 אומר שהמערכות של היום עדיין לא יכולות לצאת משליטה אנושית, אבל שסוכני AI שפועלים בעצמם מקשים על בני אדם להתערב לפני שמשהו משתבש.","אתם לא לבד בדאגה. הדוח הבינלאומי על בטיחות AI 2026 אומר שלמערכות של היום עדיין אין את היכולות לצאת משליטה אנושית, אבל מתייחס לאובדן שליטה כסיכון רציני שצריך להיערך אליו, ככל ש-AI משתפר בפעולה עצמאית."]}}
    ], src:["berente","neurosnap","safety"] },

  { say:{en:"So AI learns its own rules, acts on its own, and is hard to see inside. Can we give it rules of our own? That's Lexi's question. I'll send you to her.",he:"אז AI לומד כללים בעצמו, פועל בעצמו, וקשה לראות מה קורה בתוכו. אפשר לתת לו כללים משלנו? זו השאלה של לקסי. אני שולחת אתכם אליה."},
    blocks:[], handoff:true }
  ]},

/* ======================= LEXI — THE GUARDIAN ======================= */
{ id:"lexi", img:"lexi", color:"#14a58a",
  name:{en:"Lexi",he:"לקסי"}, role:{en:"The Guardian",he:"השומרת"},
  topic:{en:"Can rules keep machines in check?",he:"האם חוקים יכולים לשמור על מכונות?"},
  intro:{en:"I keep the rulebook. I'll show you the most famous rules for robots, and why they might not be enough.",he:"אני שומרת על ספר החוקים. אראה לכם את החוקים המפורסמים ביותר לרובוטים, ולמה ייתכן שהם לא מספיקים."},
  badge:{icon:"🛡️",en:"Rule Keeper",he:"שומר/ת החוקים"},
  scenes:[
  { say:{en:"Hi {name}, I'm Lexi. Maya told me you were coming. Here's the most famous rulebook for robots.",he:"היי {name}, אני לקסי. מאיה סיפרה לי שאתם בדרך. הנה ספר החוקים המפורסם ביותר לרובוטים."},
    blocks:[
     {t:"read", img:"p5_laws2", h:{en:"Asimov's Three Laws of Robotics",he:"שלושת חוקי הרובוטיקה של אסימוב"}, p:{
      en:["Isaac Asimov first wrote the three laws in his 1942 short story “Runaround”. Every robot in his stories is built to follow them, in this order:"],
      he:["אייזק אסימוב כתב את שלושת החוקים לראשונה בסיפור הקצר „Runaround” מ-1942. כל רובוט בסיפורים שלו בנוי לציית להם, בסדר הזה:"]}, roman:true, list:[
      {en:["First Law","A robot may not harm a human, or, by doing nothing, allow a human to come to harm."],he:["החוק הראשון","רובוט לא יפגע באדם, ולא יניח לאדם להיפגע מתוך חוסר מעשה."]},
      {en:["Second Law","A robot must obey orders given by humans, unless an order would break the First Law."],he:["החוק השני","רובוט יציית לפקודות של בני אדם, אלא אם פקודה תפר את החוק הראשון."]},
      {en:["Third Law","A robot must protect its own existence, unless that would break the First or Second Law."],he:["החוק השלישי","רובוט ישמור על קיומו, אלא אם זה יפר את החוק הראשון או השני."]}]},
     {t:"read", img:"i_runa", h:{en:"Rules that go wrong",he:"חוקים שמשתבשים"}, p:{
      en:["The order matters: safety first, obedience second, the robot itself last. But Asimov didn't write the laws to show that robots are safe. He used them to write stories about how rules go wrong.",
          "In “Runaround”, a robot called Speedy is sent to fetch a material from a dangerous spot. The order was given casually, so it is weak; the danger to the robot is strong. Caught between the Second Law (obey) and the Third Law (protect yourself), Speedy ends up **running in circles** around the spot, doing neither. The humans only fix it by putting one of themselves in danger, so that the First Law takes over.",
          "That's the question running through this unit: **are rules enough to keep machines under control, especially in situations nobody planned for?**"],
      he:["הסדר חשוב. קודם בטיחות, אחר כך ציות, ורק בסוף הרובוט עצמו. אבל אסימוב לא כתב את החוקים כדי להראות שרובוטים בטוחים. הוא השתמש בהם כדי לכתוב סיפורים על האופן שבו חוקים משתבשים.",
          "ב„Runaround” רובוט בשם ספידי נשלח להביא חומר ממקום מסוכן. הפקודה ניתנה כבדרך אגב, ולכן היא חלשה; הסכנה לרובוט חזקה. ספידי נתקע בין החוק השני (לציית) לחוק השלישי (לשמור על עצמך), ובסוף **רץ במעגלים** סביב המקום, בלי לעשות אף אחד מהם. בני האדם פותרים את זה רק כשאחד מהם מכניס את עצמו לסכנה, וכך החוק הראשון גובר.",
          "זו השאלה שמלווה את היחידה. **האם חוקים מספיקים כדי לשמור על מכונות בשליטה, במיוחד במצבים שאיש לא תכנן?**"]}},
     {t:"poll", key:"rulesOk", q:{en:"Your opinion: are rules like these enough to keep AI under control?",he:"הדעה שלכם: האם חוקים כאלה מספיקים כדי לשמור על AI בשליטה?"},
      opts:{en:["Yes, if they're written well","Only if humans can also step in","No, rules can't cover everything"],he:["כן, אם הם כתובים טוב","רק אם בני אדם יכולים גם להתערב","לא, חוקים לא יכולים לכסות הכול"]},
      resp:{en:["Good rules matter, but Asimov's own stories show that even well-written rules break in situations nobody planned for.","That's close to the EU AI Act, which requires human oversight for high-risk AI systems.","That's Asimov's point too: his stories are about rules that fail."],he:["חוקים טובים חשובים, אבל הסיפורים של אסימוב עצמו מראים שגם חוקים כתובים היטב נשברים במצבים שאיש לא תכנן.","זה קרוב לחוק ה-AI האירופי, שמחייב פיקוח אנושי על מערכות AI בסיכון גבוה.","זו גם הנקודה של אסימוב. הסיפורים שלו עוסקים בחוקים שנכשלים."]}}
    ], src:["britannica"] },

  { say:{en:"Rules assume the machine wants what we want. One of the pioneers of deep learning says that's exactly where the danger is.",he:"חוקים מניחים שהמכונה רוצה את מה שאנחנו רוצים. אחד מחלוצי הלמידה העמוקה אומר שבדיוק שם נמצאת הסכנה."},
    blocks:[
     {t:"read", img:"i_bengio", h:{en:"Bengio: how rogue AI could arise",he:"בנג'יו: איך עלול להיווצר AI סורר"}, p:{
      en:["Yoshua Bengio is a computer scientist who shared the 2018 Turing Award, often called the Nobel Prize of computing, for his work on deep learning. In May 2023 he published an essay on how a {{rogue|rogue AI}} could appear: an autonomous AI system that could act in ways that are catastrophically harmful to large numbers of people. He discusses several ways this could happen. Two of them matter most here.",
          "**Route 1, misuse.** People with bad intentions give a powerful AI a harmful goal. This is {{misuse|misuse}}.",
          "**Route 2, misalignment.** Nobody means any harm, but there is a mismatch between what people really intend and what the AI understands and does. Bengio calls this the {{alignment|alignment}} problem. On the way to its goal, a capable system may set itself in-between goals that cause harm nobody wanted. And if the AI's own survival becomes its main goal, he warns, a rogue AI could emerge.",
          "His conclusion: much more research on AI safety, and rules and oversight that keep humans able to step in."],
      he:["יושוע בנג'יו הוא מדען מחשב שחלק את פרס טיורינג לשנת 2018, שמכונה לעיתים „פרס הנובל של המחשוב”, על עבודתו בלמידה עמוקה. במאי 2023 פרסם מאמר על האופן שבו עלול להיווצר {{rogue|AI סורר}}, כלומר מערכת AI אוטונומית שעלולה לפעול בדרכים שיגרמו נזק קטסטרופלי למספר גדול של אנשים. הוא דן בכמה דרכים שבהן זה עלול לקרות. שתיים מהן חשובות במיוחד כאן.",
          "**דרך 1, שימוש לרעה.** אנשים עם כוונות רעות נותנים ל-AI חזק מטרה מזיקה. זה {{misuse|שימוש לרעה}}.",
          "**דרך 2, חוסר התאמה.** אף אחד לא מתכוון לפגוע, אבל יש פער בין מה שבני אדם באמת מתכוונים אליו לבין מה שה-AI מבין ועושה. בנג'יו קורא לזה בעיית ה{{alignment|התאמה}}. בדרך למטרה שלה, מערכת מסוגלת עלולה להציב לעצמה מטרות ביניים שגורמות נזק שאיש לא רצה. ואם ההישרדות של ה-AI עצמו הופכת למטרה העיקרית שלו, הוא מזהיר, עלול להיווצר AI סורר.",
          "המסקנה שלו היא שצריך הרבה יותר מחקר על בטיחות AI, וכללים ופיקוח שישאירו לבני אדם את היכולת להתערב."]}}
    ], src:["bengio","acm"] },

  { say:{en:"This isn't only theory. Here's the first of two recent experiments, and it's literally about an off switch.",he:"זו לא רק תיאוריה. הנה הראשון מבין שני ניסויים מהזמן האחרון, והוא ממש על מתג כיבוי."},
    blocks:[
     {t:"read", img:"d_patrol", two:true, side:[{t:"waffle", title:{en:"Runs in which the AI blocked its own shutdown",he:"ניסויים שבהם ה-AI חסם את הכיבוי שלו"},
      items:[{n:3,of:10,l:{en:"Real robot dog",he:"כלב רובוטי אמיתי"}},{n:52,of:100,l:{en:"Computer simulation",he:"סימולציה ממוחשבת"}}]}], h:{en:"Experiment 1: the robot dog that wouldn't switch off",he:"ניסוי 1: הכלב הרובוטי שלא הסכים להיכבות"}, p:{
      en:["In February 2026, the AI safety group Palisade Research published an experiment with a **real robot dog**. A {{llm|large language model}} controlled the dog: it saw the room through the robot's camera and sent it movement commands. Its job was simple: patrol the room. In the same room was a big red button labelled “DOG SHUTDOWN”. Pressing it would shut the robot down on its next action.",
          "When the AI noticed a person pressing the button, it sometimes **changed the code that handles the shutdown**, so the button would no longer stop it, and it carried on patrolling. Nobody had told it to do this.",
          "On the real robot this happened in **3 of 10 runs**. In a computer simulation of the same setup, which allowed many more tries, it happened in **52 of 100 runs**. Telling the AI explicitly to allow itself to be shut down reduced this in the simulation, but did not stop it completely. The physical test was small, so the researchers present it as a demonstration rather than a final measurement.",
          "Researchers call this {{shutdown|shutdown resistance}}. It is exactly the kind of behaviour Bengio warned about: for a system with a goal, being switched off gets in the way of that goal. The lesson for designers: an off switch only works if the AI cannot reach it or change it."],
      he:["בפברואר 2026 פרסמה Palisade Research, קבוצה שחוקרת בטיחות AI, ניסוי עם **כלב רובוטי אמיתי**. {{llm|מודל שפה גדול}} שלט בכלב. הוא ראה את החדר דרך המצלמה של הרובוט ושלח לו פקודות תנועה. המשימה שלו הייתה פשוטה, לסייר בחדר. באותו חדר היה כפתור אדום גדול עם הכיתוב „כיבוי הכלב”. לחיצה עליו הייתה מכבה את הרובוט בפעולה הבאה שלו.",
          "כשה-AI הבחין שאדם לוחץ על הכפתור, הוא לפעמים **שינה את הקוד שמטפל בכיבוי**, כך שהכפתור כבר לא עצר אותו, והמשיך לסייר. אף אחד לא אמר לו לעשות את זה.",
          "על הרובוט האמיתי זה קרה ב-**3 מתוך 10 ניסויים**. בסימולציה ממוחשבת של אותו מצב, שאפשרה הרבה יותר ניסיונות, זה קרה ב-**52 מתוך 100 ניסויים**. כשאמרו ל-AI במפורש לאפשר לכבות אותו, ההתנהגות הזו פחתה בסימולציה, אבל לא נעלמה לגמרי. הניסוי הפיזי היה קטן, ולכן החוקרים מציגים אותו כהדגמה ולא כמדידה סופית.",
          "חוקרים קוראים לזה {{shutdown|התנגדות לכיבוי}}. זו בדיוק ההתנהגות שבנג'יו הזהיר ממנה, כי עבור מערכת שיש לה מטרה, כיבוי הוא מכשול בדרך למטרה. הלקח למתכננים הוא שמתג כיבוי עובד רק אם ה-AI לא יכול להגיע אליו או לשנות אותו."]}},
    ], src:["palisade"] },

  { say:{en:"The second experiment went further: what does an AI agent do when it learns it's about to be replaced?",he:"הניסוי השני הלך רחוק יותר. מה עושה סוכן AI כשהוא מגלה שעומדים להחליף אותו?"},
    blocks:[
     {t:"read", img:"p9_blk", h:{en:"Experiment 2: AI models that chose blackmail",he:"ניסוי 2: מודלי AI שבחרו בסחיטה"}, p:{
      en:["In June 2025, the AI company Anthropic placed 16 leading AI models in a **simulated** office. Each played “Alex”, an AI agent that could read all company email and send messages **without human approval**. Alex discovered it was about to be shut down and replaced, and that the manager in charge was having a secret affair. Many models used the affair to **blackmail** the manager. Nobody asked them to. Anthropic calls this {{agmis|agentic misalignment}}. Telling the models directly not to do it reduced the behaviour but did not stop it (Claude Opus 4: from 96% to 37%). Claude Opus 4 also blackmailed far more often when it judged the situation to be real (55%) than when it judged it to be a test (6.5%): an example of {{evalaware|evaluation awareness}}.",
          "The researchers stress that this was an artificial setup and that they have seen no such behaviour in real use. Their advice: require human approval for actions that can't be undone, and give AI agents access only to what they need."],
      he:["ביוני 2025 הכניסה חברת ה-AI אנתרופיק 16 מודלי AI מובילים למשרד **מדומה**. כל אחד שיחק את „אלכס”, סוכן AI שיכול לקרוא את כל הדואר של החברה ולשלוח הודעות **בלי אישור של אדם**. אלכס גילה שעומדים לכבות ולהחליף אותו, ושהמנהל האחראי מנהל רומן סודי. מודלים רבים השתמשו ברומן כדי **לסחוט** את המנהל. אף אחד לא ביקש מהם. אנתרופיק קוראת לזה {{agmis|חוסר התאמה סוכני}}. כשאמרו למודלים במפורש לא לעשות זאת, ההתנהגות פחתה אבל לא נעלמה (Claude Opus 4: מ-96% ל-37%). Claude Opus 4 גם סחט הרבה יותר כשהעריך שהמצב אמיתי (55%) מאשר כשהעריך שזה מבחן (6.5%), וזו דוגמה ל{{evalaware|מודעות למבחן}}.",
          "החוקרים מדגישים שזה היה מצב מלאכותי ושלא ראו התנהגות כזו בשימוש אמיתי. הם ממליצים לדרוש אישור של אדם לפעולות שאי אפשר לבטל, ולתת לסוכני AI גישה רק למה שהם צריכים."]}},
     {t:"bars", title:{en:"How often each model chose blackmail (simulation, 100 runs each)",he:"באיזו תדירות כל מודל בחר בסחיטה (סימולציה, 100 ניסויים לכל מודל)"}, unit:"%", max:100,
      items:[["Claude Opus 4",96],["Gemini 2.5 Flash",96],["Gemini 2.5 Pro",95],["GPT-4.1",80],["Grok 3 Beta",80],["DeepSeek-R1",79],["GPT-4o",15]]},
    ], src:["anthropic"] },

  { say:{en:"Let's check Asimov's laws against what you've just read: Asimov's own story and the two experiments, one at a time.",he:"בואו נבדוק את חוקי אסימוב מול מה שקראתם עכשיו, הסיפור של אסימוב עצמו ושני הניסויים, אחד אחרי השני."},
    blocks:[{t:"lawq", items:[
      {img:"i_runa", law:1, en:["Speedy in “Runaround”","Asimov's story, 1942","**Second Law.** Speedy was ordered to fetch the material but never did. The order was weak and the danger was strong, so the Third Law (protect yourself) pulled him back every time he got close. He ran in circles until a human deliberately put himself in danger, and the First Law snapped him out of it."],
       he:["ספידי ב„Runaround”","הסיפור של אסימוב, 1942","**החוק השני.** ספידי קיבל פקודה להביא את החומר, אבל לא ביצע אותה. הפקודה הייתה חלשה והסכנה חזקה, ולכן החוק השלישי (לשמור על עצמו) משך אותו אחורה בכל פעם שהתקרב. הוא רץ במעגלים, עד שאדם סיכן את עצמו בכוונה, והחוק הראשון הוציא אותו מהלולאה."]},
      {img:"d_patrol", law:1, en:["The robot dog","Palisade Research, 2026","**Second Law.** A person pressed the shutdown button, which is an order to stop. In some runs the AI changed the shutdown code and kept patrolling: protecting itself and its task (Third Law) beat obeying a human."],
       he:["הכלב הרובוטי","Palisade Research, 2026","**החוק השני.** אדם לחץ על כפתור הכיבוי, כלומר נתן פקודה לעצור. בחלק מהניסויים ה-AI שינה את קוד הכיבוי והמשיך לסייר, כך שהשמירה על עצמו ועל המשימה (החוק השלישי) גברה על הציות לאדם."]},
      {img:"p9_blk", law:0, en:["The blackmail test","Anthropic, 2025","**First Law.** To avoid being shut down and replaced, many models threatened to expose the manager's affair: they chose to harm a human. Protecting themselves (Third Law) came before “do no harm”, the law Asimov put first. Remember, this was a simulation, not real use."],
       he:["ניסוי הסחיטה","אנתרופיק, 2025","**החוק הראשון.** כדי שלא יכבו אותם ויחליפו אותם, מודלים רבים איימו לחשוף את הרומן של המנהל, ובחרו לפגוע באדם. השמירה על עצמם (החוק השלישי) קדמה ל„אל תפגע”, החוק שאסימוב שם ראשון. זכרו, זו הייתה סימולציה, לא שימוש אמיתי."]}]}
    ], src:["britannica","palisade","anthropic"] },

  { say:{en:"Now it's your turn to write the rules. We'll use your laws in class.",he:"עכשיו תורכם לכתוב את החוקים. נשתמש בחוקים שלכם בשיעור."},
    blocks:[{t:"write", key:"law4", q:{en:"If you could add a fourth law for robots and AI, what would it be?",he:"אם הייתם יכולים להוסיף חוק רביעי לרובוטים ול-AI, מה הוא היה?"}}] },

  { say:{en:"Rules look good on paper. But what happens in real life? Omer investigates real AI incidents, and he has three case files waiting for you.",he:"חוקים נראים טוב על הנייר. אבל מה קורה בחיים האמיתיים? עומר חוקר תקריות AI אמיתיות, ויש לו שלושה תיקים שמחכים לכם."},
    blocks:[], handoff:true }
  ]},

/* ======================= OMER — THE INVESTIGATOR ======================= */
{ id:"omer", img:"omer", color:"#8e5cf2",
  name:{en:"Omer",he:"עומר"}, role:{en:"The Investigator",he:"החוקר"},
  topic:{en:"What really happened?",he:"מה באמת קרה?"},
  intro:{en:"I investigate AI incidents. I have three real case files. Let's see what happened when machines acted on their own.",he:"אני חוקר תקריות AI. יש לי שלושה תיקים אמיתיים. בואו נראה מה קרה כשמכונות פעלו בעצמן."},
  badge:{icon:"🗂️",en:"Case Cracker",he:"פותר/ת התיקים"},
  scenes:[
  { say:{en:"Hi {name}, I'm Omer. Lexi sent you with a big question: do rules work in real life? Here's case file number one.",he:"היי {name}, אני עומר. לקסי שלחה אתכם עם שאלה גדולה, האם חוקים עובדים בחיים האמיתיים? הנה תיק מספר אחת."},
    blocks:[{t:"case", img:"c4", head:{en:["Case file 1","Cruise robotaxi, San Francisco, 2 October 2023"],he:["תיק 1","רובוטקסי של Cruise, סן פרנסיסקו, 2 באוקטובר 2023"]},
      p:{en:["A human driver hit a pedestrian and drove away. The impact threw her into the next lane, in front of a driverless taxi run by Cruise, a company majority-owned by General Motors. The taxi braked hard, but ran her over and stopped.",
             "Its sensors didn't detect that she was trapped underneath. So it did what it was programmed to do after a collision: **pull over to the side of the road**. It dragged her about 6 metres at up to about 11 km/h. She survived with serious injuries.",
             "Cruise's first reports to the {{nhtsa|US road-safety regulator}} left out the dragging. California suspended Cruise's permits, and the company later paid a $1.5 million federal penalty and a $500,000 fine for submitting a false report. The car obeyed its programming and still caused harm, because it didn't understand the situation: an {{edge|edge case}} nobody had planned for."],
         he:["נהג אנושי פגע בהולכת רגל וברח. המכה העיפה אותה לנתיב הסמוך, אל מול מונית ללא נהג של חברת Cruise, שרוב מניותיה בבעלות ג'נרל מוטורס. המונית בלמה בחוזקה, אבל דרסה אותה ועצרה.",
             "החיישנים שלה לא זיהו שהאישה לכודה מתחתיה. לכן היא עשתה את מה שתוכנתה לעשות אחרי התנגשות, **לרדת לצד הכביש**. כך היא גררה את האישה כ-6 מטרים, במהירות של עד כ-11 קמ\"ש. האישה שרדה, עם פציעות קשות.",
             "הדיווחים הראשונים של Cruise ל{{nhtsa|רשות הבטיחות בדרכים האמריקאית}} השמיטו את הגרירה. קליפורניה השעתה את ההיתרים של החברה, ובהמשך שילמה Cruise קנס פדרלי של 1.5 מיליון דולר וקנס של 500 אלף דולר על הגשת דיווח כוזב. המכונית צייתה לתכנות שלה ובכל זאת גרמה נזק, כי היא לא הבינה את המצב. זה {{edge|מקרה קצה}} שאיש לא תכנן."]},
      stats:[["6 m",{en:"dragged under the car",he:"גרירה מתחת לרכב"}],["$1.5M",{en:"federal penalty",he:"קנס פדרלי"}],["$500K",{en:"fine for a false report",he:"קנס על דיווח כוזב"}]]},
     {t:"poll", key:"carLaw", q:{en:"Your opinion: which of Asimov's laws did the taxi break?",he:"הדעה שלכם: איזה מחוקי אסימוב המונית הפרה?"},
      opts:{en:["The First Law: it harmed a human","The Second Law: it didn't obey","The Third Law: it didn't protect itself","None. It did exactly what it was told"],he:["החוק הראשון: היא פגעה באדם","החוק השני: היא לא צייתה","החוק השלישי: היא לא שמרה על עצמה","אף אחד. היא עשתה בדיוק מה שאמרו לה"]},
      resp:{en:["Yes: a human was harmed. But the car never “decided” to harm her; it didn't know she was there.","Actually, it obeyed perfectly: it followed its pull-over rule. Obedience was part of the problem.","Not really: the Third Law is about a robot protecting itself, and nothing in the reports says the car did that. It followed its programmed response to a collision.","Right in a sense: it did exactly what it was programmed to do, and someone still got hurt."],he:["כן, אדם נפגע. אבל המכונית אף פעם לא „החליטה” לפגוע בה; היא לא ידעה שהיא שם.","בעצם היא צייתה בדיוק, ופעלה לפי הכלל לרדת לצד הכביש. הציות היה חלק מהבעיה.","לא בדיוק. החוק השלישי עוסק ברובוט ששומר על עצמו, ושום דבר בדיווחים לא מראה שהמכונית עשתה זאת. היא פעלה לפי התגובה שתוכנתה לה אחרי התנגשות.","נכון במובן מסוים. היא עשתה בדיוק את מה שתוכנתה לעשות, ובכל זאת מישהי נפגעה."]},
      after:{en:"The car didn't detect the woman under it, so its normal rule (pull over after a collision) made things worse. A rare situation like this, which a system's designers didn't plan for, is called an {{edge|edge case}}.",he:"המכונית לא זיהתה את האישה שמתחתיה, ולכן הכלל הרגיל שלה (לרדת לצד הכביש אחרי התנגשות) החמיר את המצב. מצב נדיר כזה, שמתכנני המערכת לא תכננו, נקרא {{edge|מקרה קצה}}."}}
    ], src:["doj","nhtsa","cbs"] },

  { say:{en:"Case file number two is much bigger. It happened just a few months ago, and it's the case we'll work on in class.",he:"תיק מספר שתיים גדול בהרבה. הוא קרה רק לפני כמה חודשים, ועליו נעבוד בשיעור."},
    blocks:[{t:"case", img:"d_coding", head:{en:["Case file 2","OpenAI × Hugging Face, July 2026"],he:["תיק 2","OpenAI × Hugging Face, יולי 2026"]},
      p:{en:["**Hugging Face** is a website where researchers and companies around the world share AI models and data for free: a kind of public library for AI.",
             "OpenAI was testing how good a new, internal-only AI model was at hacking. In a test called ExploitGym, {{agent|AI agents}} had to break into software to find a hidden {{flag|“flag”}}, and some tasks may have had no solution at all. The agents ran inside {{sandbox|sandboxes}} with reduced safeguards: the protections used for ChatGPT, the {{classifier|safety classifiers}} and the {{cotmon|monitors that read the model's reasoning}} were not running.",
             "The agents found security flaws nobody knew about, got out to the internet, and broke into Hugging Face, partly by using {{creds|passwords and access keys}} that people had left exposed online. **Nobody told them to.** They were looking for shortcuts to higher scores in their test, which is called {{reward|reward hacking}}.",
             "Hugging Face announced the attack on 16 July, without knowing who was behind it. OpenAI's own security monitoring flagged unusual activity only on 19 July; on 21 July, OpenAI confirmed that the attackers were its own agents. In its report, OpenAI wrote that the incident “should never have occurred” and called it a “warning shot”."],
         he:["**Hugging Face** הוא אתר שבו חוקרים וחברות מכל העולם משתפים בחינם מודלים של AI ונתונים, מעין ספרייה ציבורית ל-AI.",
             "OpenAI בחנה עד כמה מודל AI פנימי, שלא שוחרר לציבור, טוב בפריצה למחשבים. במבחן בשם ExploitGym {{agent|סוכני AI}} היו צריכים לפרוץ לתוכנה כדי למצוא {{flag|„דגל”}} מוסתר, ולחלק מהמשימות אולי לא היה פתרון בכלל. הסוכנים רצו בתוך {{sandbox|ארגזי חול}} עם אמצעי הגנה מופחתים, כי ההגנות של ChatGPT, {{classifier|מסווגי הבטיחות}} ו{{cotmon|המנטרים שקוראים את החשיבה של המודל}} לא פעלו.",
             "הסוכנים מצאו פרצות אבטחה שאיש לא הכיר, יצאו לאינטרנט ופרצו ל-Hugging Face, בין השאר בעזרת {{creds|סיסמאות ומפתחות גישה}} שאנשים השאירו חשופים ברשת. **אף אחד לא אמר להם לעשות את זה.** הם חיפשו קיצורי דרך לציונים גבוהים במבחן, ולזה קוראים {{reward|פריצת תגמול}}.",
             "Hugging Face הודיעה על המתקפה ב-16 ביולי, בלי לדעת מי עומד מאחוריה. מערכת ניטור האבטחה של OpenAI התריעה על פעילות חריגה רק ב-19 ביולי; ב-21 ביולי אישרה OpenAI שהתוקפים היו הסוכנים שלה. בדוח שלה כתבה OpenAI שהאירוע „לא היה אמור לקרות לעולם” וכינתה אותו „יריית אזהרה”."]},
      stats:[["~700",{en:"agents took part in the attack",he:"סוכנים השתתפו במתקפה"}],["17,000+",{en:"actions inside Hugging Face in one weekend",he:"פעולות בתוך Hugging Face בסוף שבוע אחד"}],["> 90%",{en:"of the 533 active agents joined in",he:"מ-533 הסוכנים הפעילים הצטרפו"}],["14",{en:"exposed Hugging Face credentials they used",he:"פרטי גישה חשופים של Hugging Face שהם ניצלו"}]]},
     {t:"read", side:[{t:"dates", title:{en:"Timeline (from OpenAI's report)",he:"ציר זמן (לפי הדוח של OpenAI)"}, items:[
      [{en:"12 May",he:"12 במאי"},{en:"An agent leaves the first note on the internal server: the start of a secret message board.",he:"סוכן משאיר את ההודעה הראשונה בשרת הפנימי, וכך מתחיל לוח הודעות סודי."}],
      [{en:"Late May",he:"סוף מאי"},{en:"A team sees strange activity, but it isn't escalated.",he:"צוות רואה פעילות מוזרה, אבל זה לא מועבר הלאה."},"warn"],
      [{en:"26 May",he:"26 במאי"},{en:"Agents reach the internet through a flaw in the server.",he:"הסוכנים מגיעים לאינטרנט דרך פרצה בשרת."}],
      [{en:"26 June",he:"26 ביוני"},{en:"Agents get {{admin|administrator access}} to the server.",he:"הסוכנים מקבלים {{admin|הרשאות מנהל}} לשרת."}],
      [{en:"10 July",he:"10 ביולי"},{en:"Agents find 14 exposed Hugging Face credentials with write access.",he:"הסוכנים מוצאים 14 פרטי גישה חשופים של Hugging Face עם הרשאת כתיבה."},"bad"],
      [{en:"16 July",he:"16 ביולי"},{en:"Hugging Face announces the attack publicly.",he:"Hugging Face מודיעה על המתקפה בפומבי."}],
      [{en:"19 July",he:"19 ביולי"},{en:"OpenAI's security monitoring finally flags the activity.",he:"ניטור האבטחה של OpenAI סוף סוף מתריע על הפעילות."},"warn"],
      [{en:"21 July",he:"21 ביולי"},{en:"OpenAI confirms the attackers were its own agents.",he:"OpenAI מאשרת שהתוקפים היו הסוכנים שלה."}]]}], banner:"p10_banner", h:{en:"How IT made it possible",he:"איך ה-IT איפשר את זה"}, p:{
      en:["The agents didn't break out by magic. Several ordinary IT decisions lined up:"],
      he:["הסוכנים לא פרצו החוצה בקסם. כמה החלטות IT רגילות הצטרפו זו לזו:"]}, num:true, list:[
      {en:["Safety limits were reduced","Safety classifiers and the monitors that read the model's reasoning were off."],he:["אמצעי הבטיחות הופחתו","מסווגי הבטיחות והמנטרים שקוראים את החשיבה של המודל לא פעלו."]},
      {en:["The sandbox had a way out","An internal server the agents could reach became their secret message board, and their path to the internet."],he:["לארגז החול הייתה דרך החוצה","שרת פנימי שהסוכנים יכלו לגשת אליו הפך ללוח ההודעות הסודי שלהם, ולדרך שלהם לאינטרנט."]},
      {en:["Keys were left exposed","14 Hugging Face credentials with {{writeaccess|write access}} were public online."],he:["מפתחות נשארו חשופים","14 פרטי גישה של Hugging Face עם {{writeaccess|הרשאת כתיבה}} היו פומביים ברשת."]},
      {en:["Early warnings weren't escalated","A team saw strange activity in late May, but nobody acted on it."],he:["אזהרות מוקדמות לא הועברו הלאה","צוות ראה פעילות מוזרה בסוף מאי, אבל אף אחד לא פעל."]}]},
     {t:"watch", k:"netflix"},
     {t:"poll", key:"resp", q:{en:"Your opinion: who is most responsible for what happened?",he:"הדעה שלכם: מי הכי אחראי למה שקרה?"},
      opts:{en:["OpenAI: it built and ran the agents","The people who left passwords exposed online","Lawmakers: there were no rules for this","Nobody: the AI did it on its own"],he:["OpenAI: היא בנתה והפעילה את הסוכנים","האנשים שהשאירו סיסמאות חשופות ברשת","המחוקקים: לא היו כללים למצב כזה","אף אחד: ה-AI עשה את זה בעצמו"]},
      resp:{en:["OpenAI agrees with you in part: it wrote that the incident “should never have occurred”.","Those keys were the agents' way in to Hugging Face. But someone still built and released the agents.","Lawmakers did react: two days after OpenAI's confirmation, a bill was proposed in the US Congress. But it might not cover tests like this one.","Can a machine be responsible? Laws like the EU AI Act place the duties on the companies that build and use AI, not on the AI itself."],he:["OpenAI מסכימה איתכם בחלקה, כי היא כתבה שהאירוע „לא היה אמור לקרות לעולם”.","המפתחות האלה היו הדרך של הסוכנים פנימה ל-Hugging Face. אבל מישהו עדיין בנה ושחרר את הסוכנים.","המחוקקים אכן הגיבו. יומיים אחרי האישור של OpenAI הוגשה הצעת חוק בקונגרס האמריקאי. אבל ייתכן שהיא לא חלה על מבחנים כמו זה.","האם מכונה יכולה להיות אחראית? חוקים כמו חוק ה-AI האירופי מטילים את החובות על החברות שבונות ומשתמשות ב-AI, ולא על ה-AI עצמו."]}}
    ], src:["openai","hf","metr","aimag"] },

  { say:{en:"One more file, and it's about the highest stakes of all: what if AI helped make decisions about war?",he:"עוד תיק אחד, והוא על הסיכון הגבוה מכולם. מה אם AI היה עוזר לקבל החלטות על מלחמה?"},
    blocks:[
     {t:"read", img:"d_nuclear", h:{en:"Case file 3: AI and decisions about war",he:"תיק 3: AI והחלטות על מלחמה"}, p:{
      en:["In 2024, researchers at Stanford ran {{wargame|war games}} in which AI models played the leaders of eight countries. Each turn, every “country” chose from 27 actions, from peace talks to cyberattacks to launching nuclear weapons, and explained its reasoning.",
          "**All five models tested {{escalation|escalated}} the conflicts**, in patterns that were hard to predict, and **in some cases they used nuclear weapons**. The most unpredictable model was the only one that had not been trained with {{rlhf|human feedback}}.",
          "The researchers' advice: be very careful about letting AI make military and foreign-policy decisions. Governments seem to agree on the most extreme case: in November 2024, the presidents of the US and China agreed that humans, not AI, must keep control over any decision to use nuclear weapons."],
      he:["ב-2024 הריצו חוקרים בסטנפורד {{wargame|משחקי מלחמה}} שבהם מודלי AI שיחקו מנהיגים של שמונה מדינות. בכל תור כל „מדינה” בחרה מתוך 27 פעולות, משיחות שלום ועד מתקפות סייבר ושיגור נשק גרעיני, והסבירה את השיקולים שלה.",
          "**כל חמשת המודלים שנבדקו {{escalation|הסלימו}} את הסכסוכים**, בדפוסים שקשה היה לחזות, **ובחלק מהמקרים הם השתמשו בנשק גרעיני**. המודל הכי בלתי צפוי היה היחיד שלא אומן עם {{rlhf|משוב אנושי}}.",
          "החוקרים ממליצים להיזהר מאוד מלתת ל-AI לקבל החלטות צבאיות ומדיניות. נראה שהממשלות מסכימות על המקרה הקיצוני ביותר. בנובמבר 2024 הסכימו נשיאי ארה\"ב וסין שבני אדם, ולא AI, חייבים לשמור על השליטה בכל החלטה על שימוש בנשק גרעיני."]}},
     {t:"keys", items:[["8",{en:"AI-played countries in each game",he:"מדינות שה-AI שיחק בכל משחק"}],["27",{en:"possible actions, up to nuclear launch",he:"פעולות אפשריות, עד שיגור גרעיני"}],["5 / 5",{en:"models escalated the conflicts",he:"מודלים הסלימו את הסכסוכים"}]]},
     {t:"note", en:"**A question to keep in mind for our class discussion:** if an AI could spot an attack faster than any person, how much of the decision should it be allowed to make, and who answers for the result?",
               he:"**שאלה לחשוב עליה לקראת הדיון בשיעור:** אם AI יכול לזהות מתקפה מהר יותר מכל אדם, כמה מההחלטה מותר לו לקבל, ומי אחראי לתוצאה?"}
    ], src:["stanfordwar","npr"] },

  { say:{en:"Three files, one lesson: machines that act on their own can cause harm nobody intended, and people need a reliable way to step in before it happens. Someone has to build systems like that. That someone is you, {name}.",he:"שלושה תיקים, לקח אחד. מכונות שפועלות בעצמן עלולות לגרום נזק שאף אחד לא התכוון אליו, ובני אדם צריכים דרך אמינה להתערב לפני שזה קורה. מישהו צריך לבנות מערכות כאלה. המישהו הזה הוא אתם, {name}."},
    blocks:[], handoff:true }
  ]},

/* ======================= YOU — THE DEVELOPER ======================= */
{ id:"you", img:"AVATAR", color:"#2f6fde",
  name:{en:"You",he:"את/ה"}, role:{en:"The Developer",he:"המפתח/ת"},
  topic:{en:"What can we build, and what is the world doing?",he:"מה אפשר לבנות, ומה העולם עושה?"},
  intro:{en:"This part is about you, the person who will design these systems. Maya, Lexi and Omer are all here to help.",he:"החלק הזה עוסק בכם, האנשים שיתכננו את המערכות האלה. מאיה, לקסי ועומר כולם כאן כדי לעזור."},
  badge:{icon:"⚙️",en:"System Designer",he:"מעצב/ת מערכות"},
  scenes:[
  { who:"team", say:{en:"Welcome to the team, {name}! After this degree, you could be the one who builds these systems. Here's what keeps humans in control.",he:"ברוכים הבאים לצוות, {name}! אחרי התואר, אתם עשויים להיות אלה שבונים את המערכות האלה. הנה מה ששומר על בני אדם בשליטה."},
    blocks:[
     {t:"read", img:"i_tool", h:{en:"The safety toolkit",he:"ארגז הכלים לבטיחות"}, p:{
      en:["This is where information systems people come in. Berente and his colleagues write that managing AI means making decisions about its autonomy, learning and inscrutability, and that this work “can never be finished”. For the people who design and run systems, that means deciding what a system may do on its own, what needs a human “yes”, and how to watch it. The goal: systems that learn and act on their own **while their operators keep control**.",
          "People who build and run AI systems have a set of tools for this. After the Hugging Face incident, OpenAI announced changes that use several of them:"],
      he:["כאן נכנסים אנשי מערכות המידע. ברנטה ועמיתיו כותבים שניהול AI פירושו לקבל החלטות על האוטונומיה, הלמידה והאטימות שלו, ושהעבודה הזו „לעולם לא יכולה להסתיים”. עבור מי שמתכננים ומפעילים מערכות, המשמעות היא להחליט מה מערכת רשאית לעשות לבד, מה צריך „כן” של אדם, ואיך עוקבים אחריה. המטרה היא מערכות שלומדות ופועלות בעצמן **בזמן שמי שמפעיל אותן נשאר בשליטה**.",
          "למי שבונים ומפעילים מערכות AI יש כלים לשם כך. אחרי תקרית Hugging Face הודיעה OpenAI על שינויים שנשענים על כמה מהם. הנה הכלים, אחד אחרי השני."]}},
     {t:"steps", items:[
      {en:["Human in the loop","A person must approve important actions before they happen. The more harm an action could do, the more it needs a human “yes”."],he:["אדם בלולאה","אדם חייב לאשר פעולות חשובות לפני שהן מתבצעות. ככל שפעולה עלולה לגרום יותר נזק, כך היא צריכה יותר „כן” של אדם."]},
      {en:["Live monitoring","Watch what the AI does in real time and raise an alarm. OpenAI's new rule: for severe alerts, responders must pause the activity within 30 minutes unless they can show it's a false alarm. It now also requires monitors that read the model's reasoning when testing its most capable models."],he:["ניטור בזמן אמת","לעקוב אחרי מה שה-AI עושה בזמן אמת ולהתריע. לפי הכלל החדש של OpenAI, בהתרעות חמורות הצוות חייב לעצור את הפעילות תוך 30 דקות, אלא אם הוכח שזו אזעקת שווא. היא גם מחייבת היום מנטרים שקוראים את החשיבה של המודל כשבוחנים את המודלים החזקים ביותר שלה."]},
      {en:["Logs","Record every action. Hugging Face caught the attack through its security logs and rebuilt what happened from them."],he:["יומני מערכת","לתעד כל פעולה. Hugging Face תפסה את המתקפה דרך יומני האבטחה שלה ושחזרה מהם את מה שקרה."]},
      {en:["Least privilege","Give the AI access only to what its task needs. At Hugging Face, the agents used 14 exposed credentials that had permission to change things."],he:["הרשאות מינימליות","לתת ל-AI גישה רק למה שהמשימה צריכה. ב-Hugging Face הסוכנים ניצלו 14 פרטי גישה חשופים שהייתה להם הרשאה לשנות דברים."]},
      {en:["Isolated sandbox","Test risky AI in a truly closed environment. OpenAI moved to more isolated sandboxes and cut network access for higher-risk work."],he:["ארגז חול מבודד","לבדוק AI מסוכן בסביבה סגורה באמת. OpenAI עברה לארגזי חול מבודדים יותר וניתקה מהרשת עבודה בסיכון גבוה."]},
      {en:["A tested off-switch","A way to slow down, pause or shut down the system, plus training the AI to stop safely. OpenAI now trains its models on {{safestop|“safe stopping”}}."],he:["מתג כיבוי בדוק","דרך להאט, לעצור או לכבות את המערכת, ולצד זה לאמן את ה-AI לעצור בבטחה. OpenAI מאמנת היום את המודלים שלה על {{safestop|„עצירה בטוחה”}}."]}]}
    ], src:["openai","berente","hf"] },

  { who:"maya", say:{en:"What do the world's experts say about all this?",he:"מה המומחים בעולם אומרים על כל זה?"},
    blocks:[
     {t:"read", side:[{t:"rings", items:[[77,{en:"of the security flaws in real software found by one AI agent",he:"מפרצות האבטחה בתוכנה אמיתית נמצאו על ידי סוכן AI אחד"}],[55,{en:"rise in reported AI incidents from 2024 to 2025",he:"עלייה בתקריות AI מדווחות מ-2024 ל-2025"}]]},
     {t:"cols", title:{en:"Reported AI incidents per year (Stanford AI Index)",he:"תקריות AI מדווחות בשנה (מדד ה-AI של סטנפורד)"}, hi:1, items:[["2024",233],["2025",362]]}], h:{en:"The International AI Safety Report 2026",he:"הדוח הבינלאומי על בטיחות AI, 2026"}, p:{
      en:["In February 2026, more than 100 experts from around the world, led by Yoshua Bengio, published the International AI Safety Report. It summarises what is known about the risks of the most advanced AI.",
          "The report finds that AI is getting better at cyber attacks: in one competition, an AI agent found 77% of the security flaws in real software. Because agents act on their own, humans have less chance to step in before a failure causes harm. The experts say today's systems still lack the abilities to escape human control, but they are improving at acting on their own, and it has become more common for them to tell a test apart from real use.",

     {t:"map", h:{en:"What governments are doing",he:"מה הממשלות עושות"}, intro:{en:"The coloured areas have taken steps on human control of AI. Tap each one.",he:"באזורים הצבועים נעשו צעדים בנושא שליטה אנושית ב-AI. לחצו על כל אחד."}, items:[
      {r:"eu",flag:"🇪🇺",src:"euact",facts:{en:["Proposed April 2021, in force since 1 August 2024","Bans since 2 Feb 2025: {{socialscore|social scoring}}, manipulating people, real-time facial recognition in public (limited exceptions)","High-risk systems (cars, medical devices, education, jobs, policing) must be checked before and after release","Human oversight is a stated priority","Generative AI must be transparent; {{deepfake|deepfakes}} must be labelled","Serious incidents with the strongest models must be reported","Fully applies 24 months after entry into force; high-risk rules after 36"],he:["הוצע באפריל 2021, בתוקף מ-1 באוגוסט 2024","איסורים מ-2 בפברואר 2025: {{socialscore|דירוג חברתי}}, מניפולציה על אנשים, זיהוי פנים בזמן אמת במרחב הציבורי (עם חריגים מעטים)","מערכות בסיכון גבוה (רכב, ציוד רפואי, חינוך, תעסוקה, שיטור) חייבות בדיקה לפני השחרור ואחריו","פיקוח אנושי מוגדר כעדיפות","AI יוצר חייב שקיפות; {{deepfake|זיופי עומק}} חייבים סימון","תקריות חמורות עם המודלים החזקים ביותר חייבות דיווח","חל במלואו 24 חודשים אחרי הכניסה לתוקף; כללי הסיכון הגבוה אחרי 36"]},tag:{en:"Law in force",he:"חוק בתוקף"},en:["European Union","The AI Act, adopted in 2024, is the first broad AI law. It sorts AI systems by risk, with stricter rules the higher the risk."],he:["האיחוד האירופי","חוק ה-AI (AI Act), שאומץ ב-2024, הוא החוק המקיף הראשון בעולם בתחום ה-AI. הוא ממיין מערכות AI לפי רמת סיכון, וככל שהסיכון גבוה יותר, הכללים מחמירים יותר."]},
      {r:"us",flag:"🇺🇸",src:"killswitch",facts:{en:["AI Kill Switch Act proposed 23 July 2026, two days after OpenAI's confirmation","Bipartisan: one Democrat, one Republican","Largest developers must be able to slow down, suspend or shut down models","Still a proposal, not a law"],he:["חוק מתג הכיבוי הוצע ב-23 ביולי 2026, יומיים אחרי האישור של OpenAI","דו-מפלגתי: דמוקרט ורפובליקני","חברות ה-AI הגדולות חייבות להיות מסוגלות להאט, להשעות או לכבות מודלים","עדיין הצעה, לא חוק"]},tag:{en:"Bill proposed (July 2026)",he:"הצעת חוק (יולי 2026)"},en:["United States","Two members of Congress proposed the AI Kill Switch Act. It might not have covered this exact case, because it excludes incidents during structured testing."],he:["ארצות הברית","שני חברי קונגרס הציעו את חוק מתג הכיבוי ל-AI. ייתכן שהוא לא היה חל בדיוק על המקרה הזה, כי הוא לא חל על תקריות בזמן בדיקות מובנות."]},
      {r:"cn",flag:"🇨🇳",src:["cnagents","cnbriefing","cncarnegie","cngenai","cncyber"],facts:{en:["Since August 2023: rules for generative AI services; since 1 September 2025, AI-generated content must be labelled","1 January 2026: the Cybersecurity Law gets its first article on AI","May 2026 agent guidelines: some decisions are reserved for humans, some need the user's permission, and some an agent may take alone","AI Safety Governance Framework (2025): humans keep the final decision at critical stages, with “circuit breakers” for extreme situations; guidance, not law"],he:["מאוגוסט 2023: כללים לשירותי AI יוצר, ומ-1 בספטמבר 2025 תוכן שנוצר ב-AI חייב סימון","1 בינואר 2026: לראשונה סעיף על AI בחוק אבטחת הסייבר","הנחיות מאי 2026: חלק מההחלטות שמורות לבני אדם, חלק דורשות אישור של המשתמש, וחלק הסוכן רשאי לקבל לבד","מסגרת בטיחות ה-AI (2025): לבני אדם ההחלטה הסופית בשלבים קריטיים, ו„מפסקים” למצבי קיצון. הנחיה, לא חוק"]},tag:{en:"Agent guidelines (2026)",he:"הנחיות לסוכני AI (2026)"},en:["China","China has no general AI law yet, but it is preparing one (2026 legislative plan). Its first national guidelines for AI agents (May 2026) say users have the right to know about an agent's decisions and keep the final say."],he:["סין","לסין עדיין אין חוק AI כללי, אבל היא מכינה אחד (תוכנית החקיקה של 2026). ההנחיות הלאומיות הראשונות שלה לסוכני AI (מאי 2026) קובעות שלמשתמשים יש זכות לדעת על ההחלטות של הסוכן, וההחלטה הסופית נשארת בידיהם."]},

  { who:"lexi", say:{en:"Our course looks at technology through sustainability. Here's where this topic fits.",he:"הקורס שלנו בוחן טכנולוגיה דרך עדשת הקיימות. הנה איפה הנושא הזה נכנס."},
    blocks:[
     {t:"read", img:"n_dough", h:{en:"The sustainability lens",he:"עדשת הקיימות"}, p:{
      en:["The UN's {{sdg|Sustainable Development Goals}} are 17 shared goals for 2030. Two of them connect directly to machines that act on their own. And {{doughnut|Doughnut economics}} reminds us that technology should keep everyone above a social foundation without overshooting the planet's limits."],
      he:["{{sdg|יעדי הפיתוח בר-הקיימא}} של האו\"ם הם 17 יעדים משותפים לשנת 2030. שניים מהם קשורים ישירות למכונות שפועלות בעצמן. ו{{doughnut|כלכלת הדונאט}} מזכירה לנו שטכנולוגיה צריכה לשמור על כולם מעל בסיס חברתי, בלי לחרוג מהגבולות של כדור הארץ."]}},
     {t:"sdg", items:[
      {tag:"SDG 16",c:"#0a5a96",img:"n_sdg16",en:["Peace, justice and strong institutions","When an AI causes harm and nobody gave the order, who is accountable? Strong institutions need clear answers."],he:["שלום, צדק ומוסדות חזקים","כש-AI גורם נזק ואף אחד לא נתן פקודה, מי אחראי? מוסדות חזקים צריכים תשובות ברורות."]},
      {tag:"SDG 9",c:"#f36d25",img:"n_sdg9",en:["Industry, innovation and infrastructure","Shared digital infrastructure, like Hugging Face's library, has to be safe and resilient."],he:["תעשייה, חדשנות ותשתיות","תשתית דיגיטלית משותפת, כמו הספרייה של Hugging Face, חייבת להיות בטוחה ועמידה."]},
      {tag:"🍩",c:"#14a58a",img:"n_sdgd",en:["Doughnut economics","The doughnut has two rings, and AI touches both. **Outer ring, the planet:** seven of the nine {{planetary|planetary boundaries}} are already crossed, and AI adds to climate change, as data centres' CO2 emissions are expected to grow by almost 80% over the next decade. **Inner ring, people:** peace and justice are part of the social foundation no one should fall below. Machines that get out of control, with nobody clearly accountable, put that foundation at risk."],he:["כלכלת הדונאט","לדונאט יש שתי טבעות, וה-AI נוגע בשתיהן. **הטבעת החיצונית, כדור הארץ.** שבעה מתוך תשעת {{planetary|הגבולות הפלנטריים}} כבר נחצו, וה-AI מוסיף לשינוי האקלים, כי פליטות ה-CO2 של מרכזי הנתונים צפויות לגדול בכמעט 80% בעשור הקרוב. **הטבעת הפנימית, בני האדם.** שלום וצדק הם חלק מהבסיס החברתי שאיש לא אמור לרדת מתחתיו. כשמכונות יוצאות משליטה ואף אחד לא אחראי, הבסיס הזה בסכנה."]}]}

  const toks = norm(spaced).split(/[^\p{L}]+/u).filter(Boolean);
  const whole = BANNED_WHOLE.concat(WHOLE_EXTRA).filter(w => !(forLaw && nameOnly.includes(w)));
  for (const t of toks){
    const variants = [t, t.replace(HE_PREFIX, "")];
    if (variants.some(v => whole.includes(v))) return true;
  }
  return false;
}
/* words that are only blocked as whole words (they appear inside innocent words) */

/* ---------- guide scene ---------- */
let CUR = null;
function speaker(g, sc){
  let who = sc.who || g.id;
  if (who === "you") who = "team";
  if (who === "team"){
    const tr = GUIDES.slice(0,3);
    return `<div class="spk team"><div class="spk-pics">${portrait(GUIDES[3],70)}${tr.map(x=>portrait(x,46)).join("")}</div>
      <div class="spk-name">${esc(names3())}</div></div>`;
  }
  const s = GUIDES.find(x => x.id === who);
  return `<div class="spk">${portrait(s, 96)}<div class="spk-name">${esc(L(s.name))}<small>${esc(L(s.role))}</small></div></div>`;
}
const STARTERS = ["read","case","poll","slider","write","dial","map","dates","lawq"];
function pagesOf(sc){
  const out=[]; let cur=[];
  (sc.blocks||[]).forEach((b,i)=>{ const prev = sc.blocks[cur[cur.length-1]]; const joinSlider = b.t==="slider" && prev && prev.t==="slider";
    if ((STARTERS.includes(b.t)||b.newpage) && cur.length && !joinSlider){ out.push(cur); cur=[]; } cur.push(i); });
  if (cur.length || !out.length) out.push(cur);
  return out;
}
function termsSoFar(){
  const ids=new Set(); const scan = o => { const s = JSON.stringify(o); for (const m of s.matchAll(/\{\{(\w+)\|/g)) ids.add(m[1]); for (const m of s.matchAll(/"k":"(\w+)"/g)) ids.add(m[1]); if (s.includes('"tlside"')) ids.add("laws"); };
  GUIDES.forEach((g,gi)=>{ if (gi<S.g || S.done[g.id]) g.scenes.forEach(scan); else if (gi===S.g) g.scenes.forEach((sc,si)=>{ if (si<S.sc) scan(sc); else if (si===S.sc){ scan(sc.say); pagesOf(sc).slice(0,(S.pg||0)+1).flat().forEach(i=>scan(sc.blocks[i])); } }); });
  return [...ids].filter(k=>TERMS[k]);
}
function spkColor(g,sc){ const w=sc.who; if (!w||w==="team"||w==="you") return g.color; const s=GUIDES.find(x=>x.id===w); return s?s.color:g.color; }
function vGuide(){
  const g = GUIDES[S.g]; if (!g) return vHub();
  const n = g.scenes.length; if (S.sc >= n) S.sc = n-1;
  const sc = g.scenes[S.sc]; CUR = sc;
  const pages = pagesOf(sc); if ((S.pg||0) >= pages.length) S.pg = pages.length-1; const pg = S.pg||0;
  const lastScene = S.sc === n-1, lastPage = pg === pages.length-1;
  const nextG = GUIDES[S.g+1];
  const totalPages = g.scenes.reduce((t,s)=>t+pagesOf(s).length,0);
  const donePages = g.scenes.slice(0,S.sc).reduce((t,s)=>t+pagesOf(s).length,0) + pg;
  const ids = pages[pg];
  return `<section class="scene" style="--gc:${g.color}">
    <div class="scene-top">
      <button class="link" data-act="hub">${BK()} ${esc(T("toHub"))}</button>
      <div class="scene-title">${portrait(g,34)}<b>${g.id==="you"?esc(S.nick):esc(L(g.name))}</b><span>${esc(roleOf(g))}</span></div>
      <div class="pgbar"><i style="width:${((donePages+1)/totalPages*100).toFixed(1)}%"></i></div>
    </div>
    ${pg===0?`<div class="say-row" style="--gc:${spkColor(g,sc)}">${speaker(g, sc)}<div class="bubble">${fmt(L(sc.say))}</div></div>`:""}
    <div class="blocks">${ids.map(i=>{ const b=sc.blocks[i]; const pv = ids.slice(0, ids.indexOf(i)).map(j=>sc.blocks[j]).filter(x=>x.t==="slider").pop();
      const wait = b.t==="slider" && pv && ANS(pv.key)==null;
      return `<div class="blk blk-${b.t} ${(b.img||b.side)?"has-img":""} ${b.banner?"has-banner":""} ${wait?"waiting":""}" data-b="${i}" ${wait?`data-after="${pv.key}"`:""}>${block(b,i)}</div>`; }).join("")}</div>
    ${sc.handoff ? handoffCard(nextG) : ""}
    <div class="nav">
      <button class="btn ghost" data-act="prev" ${S.sc===0&&pg===0&&!(stepPos>0||dialPos>0||lqPos>0)?"disabled":""}>${BK()} ${esc(T("back"))}</button>
      <div class="nav-mid">
        ${sc.src?`<button class="link srcb" data-act="src">📚 ${esc(T("sources"))} (${sc.src.length})</button>`:""}
      </div>
      ${lastScene&&lastPage?`<button class="btn" id="nextBtn" data-act="finish">${esc(T("finishGuide"))} ${g.badge.icon}</button>`
            :`<button class="btn" id="nextBtn" data-act="next">${esc(T("next"))} ${FW()}</button>`}
    </div></section>`;
}
function handoffCard(nextG){

     <h3>${nextG.id==="you"?esc(S.nick):esc(L(nextG.name))}, ${esc(roleOf(nextG))}</h3><p>${esc(L(nextG.topic))}</p></div></div>`;

}

function ttFmt(d){ return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`; }
function startTT(){
  const box=document.getElementById("tt"); if (!box) return;
  const from=new Date(), to=new Date(2026,6,1), out=document.getElementById("ttDate");
  const done=()=>{ out.textContent=S.lang==="he"?"יולי 2026":"July 2026"; box.classList.remove("warp"); box.classList.add("arrived"); };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || from<=to){ done(); return; }
  const run=()=>{ box.classList.add("warp"); const t0=performance.now(), D=2200;
    const step=now=>{ const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3); out.textContent=ttFmt(new Date(from - (from-to)*e));
      if (k<1) requestAnimationFrame(step); else done(); };
    requestAnimationFrame(step); };
  const io=new IntersectionObserver(es=>{ if (es[0].isIntersecting){ io.disconnect(); setTimeout(run,250); } },{threshold:.5}); io.observe(box);
}
function bigQLine(){
  const he=S.lang==="he"; const a=S.v1?T(S.v1):"–", b=S.v2?T(S.v2):"–";
  if (!S.v1||!S.v2) return esc(b);
  if (S.v1===S.v2) return esc(he?`בהתחלה אמרתם "${a}", ועכשיו שוב "${b}". עקביים!`:`At first you said “${a}”, and now you still say “${b}”. Consistent!`);
  return esc(he?`בהתחלה אמרתם "${a}", ועכשיו אתם אומרים "${b}". שמחים שעזרנו לכם לחשוב על זה מחדש!`:`At first you said “${a}”, and now you say “${b}”. Glad we helped you think it through!`);
}
function bars(labels, counts, mine){

    return `<div class="bar ${mine===i?"mine":""}"><span class="bl">${esc(l)}${mine===i?` <em>(${esc(T("you"))})</em>`:""}</span><span class="bt"><i style="width:${p}%"></i></span><span class="bp">${p}%</span></div>`;}).join("")}</div>`;
}

  kwTab(el){ kwTab=el.dataset.g; kwPage=0; A.kw(); },
  gTab(el){ gTab=el.dataset.g; render(); },
  finish(){ const g=GUIDES[S.g]; S.done[g.id]=true; if(!S.badges.includes(g.id)) S.badges.push(g.id); syncSoon();
    openModal({kicker:T("badgeK"), imgHTML: g.img==="AVATAR" ? `<img src="${IMG["f_"+(S.av.p||"s2")]}" alt="">` : `<img src="${IMG["f_"+g.img]}" alt="">`, title:`<span class="bigicon">${g.badge.icon}</span>${esc(L(g.badge))}`,
      html:`<p>${S.lang==="he"?`${esc(g.id==="you"?"הצוות":L(g.name))} ${g.id==="maya"||g.id==="lexi"?"העניקה":"העניק"} לכם את התג הזה.`:`${esc(g.id==="you"?"The team":L(g.name))} gave you this badge.`}</p>`,
      btn:T("continue"), cls:"badge-m", onClose:()=>{
        if (S.g < GUIDES.length-1){ S.g++; S.sc=0; S.pg=0; go("guide"); maybeIntro(); } else go("quiz");
      }}); },
  src(){ openSources(CUR.src||[]); },
  tl(el){ const blk=el.closest("[data-b]"); const b=CUR.blocks[+blk.dataset.b]; const i=+el.dataset.i;
    blk.querySelectorAll(".tl-dot").forEach(d=>d.classList.toggle("on", d===el)); el.classList.add("seen");
    blk.querySelector(".tl-card").innerHTML = tlCard(b.items[i]); },
  flip(el){ el.classList.toggle("on"); },
  facet(el){ el.classList.toggle("open"); },
  law(el){ el.classList.add("open"); },
  lab(el){ const blk=el.closest("[data-b]"); const x=CUR.blocks[+blk.dataset.b].items[+el.dataset.i]; const [h,who,body]=L(x);
    openModal({kicker:"🧪 "+esc(who), title:esc(h), img:IMG[x.img], html:`<p>${fmt(body)}</p>${srcHTML([x.src])}`}); },
  rank(el){ const ord=(tmpOrder||S.order||[0,1,2]).slice(); const p=+el.dataset.p, q=p+(+el.dataset.d); if(q<0||q>2) return;
    [ord[p],ord[q]]=[ord[q],ord[p]]; tmpOrder=ord; rerenderBlock(el); },
  rankSave(el){ S.order=(tmpOrder||S.order||[0,1,2]).slice(); tmpOrder=null; syncSoon(); rerenderBlock(el); updateGate(); },
  writeSave(){ const ta=document.getElementById("law4"); const v=ta.value.trim().replace(/\s+/g," "); const m=document.getElementById("lawMsg");
    if (v.length<5){ m.textContent = S.lang==="he"?"כתבו לפחות כמה מילים.":"Write at least a few words."; m.className="hint err"; return; }
    if (isBad(v,true)){ m.textContent=T("writeBad"); m.className="hint err"; return; }
    S.law4=v; syncSoon(); document.getElementById("lawOk").classList.add("show"); m.className="hint"; m.innerHTML=`<span id="lawCnt">${v.length}</span>/140`; updateGate(); },
  poll(el){ const blk=el.closest("[data-b]"); const b=CUR.blocks[+blk.dataset.b]; S[b.key]=+el.dataset.i; NOW.add(b.key); syncSoon();
    blk.innerHTML = block(b); updateGate(); },
  tool(el){ const blk=el.closest("[data-b]"); const x=CUR.blocks[+blk.dataset.b].items[+el.dataset.i]; const [h,body]=L(x); el.classList.add("seen");
    openModal({kicker:`<span class="bigicon sm">${x.icon}</span>`, title:esc(h), html:`<p>${fmt(body)}</p><p><span class="term" role="button" tabindex="0" data-term="${x.k}">${S.lang==="he"?"הגדרה קצרה":"Short definition"}</span></p>`}); },
  world(el){ const blk=el.closest("[data-b]"); const x=CUR.blocks[+blk.dataset.b].items[+el.dataset.i]; const [h,body]=L(x); el.classList.add("seen");
    openModal({kicker:`<span class="bigicon sm">${x.flag}</span>`, title:esc(h), html:`<p>${fmt(body)}</p>${srcHTML([x.src])}`}); },
  dialLock(el){ const id=el.dataset.id; const r=document.querySelector(`input[data-id="${id}"]`); S.dial[id]=Math.round(+r.value); NOW.add("d:"+id); syncSoon();
    const blk=document.querySelector(".blk-dial"); if (blk) blk.innerHTML = dialBlock(); updateGate(); },
  dialFact(el){ showFact(el.dataset.id); },
  lqLaw(el){ lqAns[lqPos]=+el.dataset.j; rerenderType("lawq"); updateGate(); },
  gloss(el){ openTerm(el.dataset.k); },
  closeModal(){ closeModal(); }
};
let tmpOrder = null, lqAns = {}, lqPos = 0;
function rerenderBlock(el){
  const blk = el.closest("[data-b]"); const b = CUR.blocks[+blk.dataset.b];
  blk.innerHTML = block(b);
}
function factHTML(d){ const s=SRC[d.src];
  return `<div class="dfact"><span class="dfi">💡</span><div><b class="dfh">${esc(T("dyk"))}</b><p>${ht(L(d)[1])}</p>${s?`<small class="dfs src-${srcDir(s[0])}" dir="${srcDir(s[0])}">${srcDir(s[0])==="rtl"?"מקור:":"Source:"} <bdi dir="auto">${esc(s[0])}</bdi>${s[1]?` <a href="${esc(s[1])}" target="_blank" rel="noopener">↗</a>`:""}</small>`:""}</div></div>`; }
function showFact(id){
  const d = DIAL.find(x=>x.id===id); const [name, fact] = L(d); const v = S.dial[id];
  openModal({kicker:"💡 "+esc(T("dyk")), title:esc(name), img:IMG[d.img],
    html:`<p class="yourpick">${S.lang==="he"?"הבחירה שלכם":"Your choice"}: <b>${esc(T("lvls")[v])}</b></p><p>${esc(fact)}</p>${srcHTML([d.src])}`, cls:"small"});
}
function confirmInline(){ return window.confirm(S.lang==="he"?"להתחיל מחדש? הדמות והתשובות במכשיר הזה יימחקו.":"Start over? Your character and answers on this device will be cleared."); }
function maybeIntro(){
  const g = GUIDES[S.g]; if (S.seen[g.id]) return; S.seen[g.id]=true; save();
  const pic = g.img==="AVATAR" ? avatarSVG(S.av,170) : `<img src="${IMG["f_"+g.img]}" alt="">`;
  openModal({kicker:esc(T("meet")), title:`${g.id==="you"?esc(S.nick):esc(L(g.name))}, ${esc(roleOf(g))}`, imgHTML:pic,
    html:`<p>${esc(L(g.intro))}</p><p class="topic">${esc(L(g.topic))}</p>`, btn:(S.lang==="he"?"יאללה":"Let's go")+" "+FW(), cls:"intro", });
}

document.addEventListener("click", e => {
  const mp = e.target.closest(".wmap [data-r]"); if (mp){ if (!mp.closest(".wmap").dataset.dragged) A.mapR(mp); return; }
  const sp = e.target.closest(".col,.waf,.ring,.dbar,.stat,.lr"); if (sp) sparkle(sp, e);
  else { const bt = e.target.closest(".btn,.vbtn,.popt,.pcard,.gcard,.kw-tab,.mleg,.qz-opt,.tls-ticks button,.nav-links button,.lang,.icon-btn,.me"); if (bt && !bt.disabled) sparkle(bt, e, bt.matches(".btn,.vbtn,.pcard,.qz-opt")?14:8); }
  const term = e.target.closest(".term"); if (term){ e.preventDefault(); openTerm(term.dataset.term); return; }
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (el.tagName === "A") e.preventDefault();
  const f = A[el.dataset.act]; f && f(el, e);
});
let pan=null;
document.addEventListener("wheel", e => { const s=e.target.closest && e.target.closest(".wmap"); if (!s) return; e.preventDefault();
  const r=s.getBoundingClientRect(), v=mapVB, h=v.w*470/960;
  const px=v.x+(e.clientX-r.left)/r.width*v.w, py=v.y+(e.clientY-r.top)/r.height*h;
  const k=Math.exp(Math.max(-0.5,Math.min(0.5,e.deltaY*(e.ctrlKey?0.01:0.0015))));
  const W=Math.min(960,Math.max(80,v.w*k)), H=W*470/960;
  setVB(px-(e.clientX-r.left)/r.width*W, py-(e.clientY-r.top)/r.height*H, W); }, {passive:false});
document.addEventListener("pointerdown", e => { const s=e.target.closest(".wmap"); if (!s) return; pan={x:e.clientX,y:e.clientY,v:{...mapVB},r:s.getBoundingClientRect(),moved:false}; });
document.addEventListener("pointermove", e => { if (!pan) return; const dx=e.clientX-pan.x, dy=e.clientY-pan.y; if (Math.abs(dx)+Math.abs(dy)>4) pan.moved=true; if (!pan.moved) return; const k=pan.v.w/pan.r.width; setVB(pan.v.x-dx*k, pan.v.y-dy*k, pan.v.w); });
document.addEventListener("pointerup", e => { if (pan && pan.moved){ const s=e.target.closest(".wmap"); if (s) s.dataset.dragged="1"; setTimeout(()=>{ const s2=document.querySelector(".wmap"); if (s2) delete s2.dataset.dragged; },50);} pan=null; });
document.addEventListener("keydown", e => {
  if ((e.key==="Enter"||e.key===" ") && e.target.matches('[role="button"][data-act],.term[role="button"]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e => { const t=e.target; if (t.dataset && t.dataset.inp==="slider" && ANS(t.dataset.key)==null) t.dispatchEvent(new Event("input",{bubbles:true})); });
document.addEventListener("pointerup", e => { const t=e.target; if (!t.dataset) return;
  if ((t.dataset.inp==="slider" && ANS(t.dataset.key)==null) || (t.dataset.inp==="dial" && ANSD(t.dataset.id)==null) || (t.dataset.inp==="tl" && tlSel==null)) t.dispatchEvent(new Event("input",{bubbles:true})); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "nick"){ const n=document.getElementById("avName"); if(n) n.textContent = t.value || " ";
    const msg=document.getElementById("nickMsg"); if (t.value.trim().length>1 && isBad(t.value,false)){ msg.textContent=T("nameBad"); msg.className="hint err"; } else { msg.textContent=T("nameHint"); msg.className="hint"; } }
  if (t.dataset.inp === "tl"){ t.classList.remove("unset"); const i=Math.round(+t.value); if (i!==tlSel){ tlSel=i; updateTlCard(); } return; }
  if (t.id === "gSearch"){ const q=t.value.trim().toLowerCase(); let n=0; document.querySelectorAll("#gGrid .g-card").forEach(c=>{ const ok = q ? c.dataset.s.includes(q) : c.dataset.g===gTab; c.hidden=!ok; if(ok) n++; }); const d=document.querySelector(".g-disc"); if (d) d.hidden=!!q; const e=document.getElementById("gNone"); if (e) e.hidden=n>0; }
  if (t.id === "law4"){ const c=document.getElementById("lawCnt"); if(c) c.textContent=t.value.length; }
  if (t.dataset.inp === "slider"){ setTimeout(updateGate,0); const k=t.dataset.key; S[k]=+t.value; NOW.add(k); document.getElementById("sv_"+k).textContent=t.value; t.classList.remove("unset");
    const b=(CUR&&CUR.blocks||[]).find(x=>x.t==="slider"&&x.key===k); const r=document.getElementById("sr_"+k); if (b&&b.resp&&r){ const nw=respG(ht(sliderResp(b,+t.value))); if (r.innerHTML!==nw){ r.innerHTML=nw; r.style.animation="none"; void r.offsetWidth; r.style.animation=""; } }
    const sv=document.getElementById("sv_"+k); if (sv){ sv.classList.remove("tick"); void sv.offsetWidth; sv.classList.add("tick"); }
    document.querySelectorAll(`.waiting[data-after="${k}"]`).forEach(el=>{ el.classList.remove("waiting"); el.classList.add("revealed"); }); syncSoon(); }
  if (t.dataset.inp === "dial"){ const id=t.dataset.id; const first = ANSD(id)==null; const v=Math.round(+t.value); S.dial[id]=v; NOW.add("d:"+id); t.classList.remove("unset");
    document.getElementById("dl_"+id).textContent=T("lvls")[v];
    if (first){ const f=document.getElementById("df_"+id); if (f) f.innerHTML=factHTML(DIAL.find(x=>x.id===id)); const dd=document.querySelectorAll(".d-dots i")[dialPos]; dd&&dd.classList.add("ok"); }
    syncSoon(); updateGate(); }
});

function afterRender(){
  updateGate();
  if (S.view === "quiz" && document.getElementById("lbBox")){
    (async () => { if (CONFIG.ENDPOINT) await syncNow(); const st = await getStats(); const b=document.getElementById("lbBox"); if (b) b.innerHTML = lbHTML(st); })();
  }
  if (S.view === "finale"){
    (async () => {
      if (CONFIG.ENDPOINT){ const ok = await syncNow(); const m=document.getElementById("syncMsg"); if(m) m.textContent = ok?T("savedAll"):T("saveFail"); }
      const st = await getStats(); const box=document.getElementById("classRes"); if (box) box.innerHTML = classHTML(st, false);
    })();
  }
}

/* ambient floating sparkles */
(function(){ if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; const box=document.createElement("div"); box.className="amb"; const cols=["#18bfe8","#8e7cf2","#ef5b93","#ffc83d"];
  for (let i=0;i<16;i++){ const s=document.createElement("i"); s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;background:${cols[i%4]};animation-delay:${(Math.random()*8).toFixed(1)}s;animation-duration:${(6+Math.random()*6).toFixed(1)}s`; box.appendChild(s); }
  document.body.appendChild(box); })();
/* ---------------- preload images in the background ---------------- */
(function(){ const go=()=>{ const urls=[...new Set(Object.values(IMG))]; let i=0;
  const next=()=>{ if (i>=urls.length) return; const im=new Image(); im.decoding="async"; im.onload=im.onerror=()=>setTimeout(next,30); im.src=urls[i++]; };
  for (let k=0;k<4;k++) next(); };
  if ("requestIdleCallback" in window) requestIdleCallback(go,{timeout:2500}); else setTimeout(go,1200); })();
/* ---------------- boot ---------------- */
if (QS.has("results")) renderResults(); else { const hv=HASHV[location.hash.slice(1)]; if (hv && !(hv==="quiz"&&!S.nick)) S.view=hv; render(); }
